<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 安全のための決まり：このアプリは名簿などをどこにも送れない（通信先は自分のサイトだけ） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="立ち位置">
<meta name="theme-color" content="#2b2140">
<title>お遊戯会 立ち位置</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../fonts/fonts.css">
<!-- 名簿の読み込み（SheetJS）と PDF 作成（jsPDF）は、どうぐばこのサイトに置いたものを使う -->
<script src="../vendor/sheetjs/xlsx.full.min.js"></script>
<script src="../vendor/jspdf/jspdf.umd.min.js"></script>
<script defer src="../common/license.js"></script>
<style>
:root{
  --bg:#f5f3fa; --panel:#fff; --ink:#22202a; --muted:#6b6878; --line:#e3dfee; --accent:#5f3dc4; --accent-soft:#efeafd;
  --bad:#c92a2a; --badbg:#fff0f0; --warn:#d9480f; --warnbg:#fff4e6; --hdr:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;min-height:40px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button:disabled{opacity:.45;cursor:default}
input[type=text],select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:16px;min-height:42px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));background:#2b2140;color:#fff}
header h1{font-size:17px;margin:0 auto 0 0;white-space:nowrap}
header button{background:#3d3159;border-color:#55487a;color:#fff}
header button.primary{background:#fff;color:#2b2140;border-color:#fff}
.boxlink{color:#fff;text-decoration:none;background:#2f7d6b;border-radius:8px;padding:8px 12px;font-weight:700;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:14px max(14px,env(safe-area-inset-right)) 30px max(14px,env(safe-area-inset-left));align-items:start}
@media (max-width:1050px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.fld input,.fld select{width:100%}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.6}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{min-width:48px;text-align:center;font-size:22px}
.stepper button{width:48px;font-size:22px;padding:0}
details.scnames summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:10px}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:8px}
.scgrid label{display:flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
.scgrid input{flex:1;min-width:0;min-height:36px;font-size:15px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}

/* 場面のタブ */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;border-radius:999px;padding:4px 14px;min-height:40px;line-height:1.2}
.tabs button small{display:block;font-size:11px;color:var(--muted)}
.tabs button.on{background:#2b2140;border-color:#2b2140;color:#fff}
.tabs button.on small{color:#cfc6e8}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tools button{font-size:13px;min-height:36px;padding:4px 10px}

/* 並ぶ場所（ボックス） */
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:700px){.boxes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pbox,.pbox ol,.pbox li{min-width:0}
.pbox{border:2px solid var(--line);border-radius:12px;background:#fff;display:flex;flex-direction:column;min-height:170px;cursor:pointer}
.pbox.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.pbox .ph{background:var(--c);color:#fff;border-radius:9px 9px 0 0;padding:6px 8px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.pbox .ph small{font-weight:400;font-size:11px;opacity:.9}
.pbox .pnote{font-size:11px;color:var(--muted);padding:3px 8px 0}
.pbox ol{list-style:none;margin:0;padding:4px 6px 8px;display:grid;gap:3px}
.pbox li{display:flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:2px 2px 2px 6px;background:#fff}
.pbox li .no{color:var(--muted);font-size:11px;min-width:16px}
.pbox li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbox li button{flex:none;min-height:28px;min-width:26px;padding:0;border:0;background:#f3f1f8;border-radius:6px;font-size:12px}
.pbox .here{margin:auto 8px 8px;font-size:12px;text-align:center;color:var(--c);font-weight:700}
.pbox:not(.on) .here{color:var(--muted);font-weight:400}

/* 名簿から選ぶ */
.picker{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.picker .ptitle{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.picker .ptitle b{color:var(--active)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin-top:8px}
.names button{text-align:left;padding:5px 8px;min-height:44px;line-height:1.25;position:relative}
.names button .tag{display:block;font-size:11px;color:#fff;background:var(--c);border-radius:4px;padding:0 5px;width:max-content;margin-top:2px}
.names button.placed{background:#faf9fd}
.names button.here{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.left{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px}
.left.ok{background:#ebfbee;color:#2b8a3e}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px}

/* プレビュー */
.pv{position:sticky;top:calc(var(--hdr) + 14px)}
@media (max-width:1050px){.pv{position:static}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pager b{font-size:16px}
.canvasbox{background:#d9d5e3;border-radius:10px;padding:10px;display:grid;place-items:center}
.canvasbox canvas{width:100%;height:auto;max-width:620px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:2px}

/* ダイアログ・お知らせ */
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px 18px 16px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:17px}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg .list{display:grid;gap:8px}
.dlg .list button{text-align:left;padding:10px 12px}
.dlg .list small{display:block;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#22202a;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <a id="btnBox" class="boxlink" href="../">← どうぐばこ</a>
  <h1>🎭 お遊戯会 立ち位置</h1>
  <button id="btnMore" type="button">⋯ データ</button>
  <button id="btnPdf" class="primary" type="button">PDFを作成</button>
</header>

<main>
  <div>
    <section class="card">
      <h2><span class="n">1</span>クラスの名簿を読み込む</h2>
      <div class="row">
        <button class="primary" id="btnFile" type="button">📂 名簿ファイルを選ぶ</button>
        <span class="hint" id="fileInfo" style="margin:0">Numbers・Excel・CSV に対応</span>
      </div>
      <input type="file" id="fileIn" hidden accept=".numbers,.xlsx,.xls,.xlsm,.csv,.ods,application/vnd.apple.numbers,application/x-iwork-numbers-sffnumbers,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">
      <div id="classBox" hidden>
        <div class="fld"><span>クラスを選ぶ</span><select id="classSel"></select></div>
        <div class="hint" id="classPreview"></div>
      </div>
      <div id="loadErr"></div>
      <p class="hint">名簿は、この端末の中だけで使われます。インターネットには送られません。</p>
    </section>

    <section class="card">
      <h2><span class="n">2</span>お遊戯会の情報</h2>
      <div class="fld"><span>クラス名</span><input type="text" id="className" placeholder="例：ひまわり組"></div>
      <div class="fld"><span>タイトル（任意）</span><input type="text" id="title" placeholder="例：大きなかぶ"></div>
      <div class="fld"><span>場面の数</span>
        <div class="stepper"><button type="button" id="scMinus" aria-label="場面を減らす">−</button><b id="scCount">5</b><button type="button" id="scPlus" aria-label="場面を増やす">＋</button></div></div>
      <details class="scnames"><summary>場面ごとの名前をつける（任意）</summary><div class="scgrid" id="scNames"></div></details>
    </section>

    <section class="card">
      <h2><span class="n">3</span>場面ごとに、並ぶ場所へ子を入れる</h2>
      <div id="editor"><div class="empty">先に、1 でクラスの名簿を読み込んでください。</div></div>
    </section>
  </div>

  <div class="pv">
    <section class="card">
      <h2>できあがりの見本（PDFと同じ）</h2>
      <div class="pager"><button type="button" id="pvPrev">◀ 前の場面</button><b id="pvLabel">—</b><button type="button" id="pvNext">次の場面 ▶</button></div>
      <div class="canvasbox"><canvas id="pv" width="840" height="1188"></canvas></div>
    </section>
  </div>
</main>

<dialog id="dlg"></dialog>
<input type="file" id="jsonIn" hidden accept=".json,application/json,text/plain">
<div id="toast" role="status"></div>

<script>
'use strict';
/* ============================================================
   基本設定・保存（データはこの端末の中だけ）
   ============================================================ */
const NS = 'dougubako.oyugikai.';
const LS_CUR = NS + 'current.v2';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'c' + Math.random().toString(36).slice(2, 10);
const MAX_SCENES = 30;
// 並ぶ場所（図の左から順）。色は画面とPDFで同じ
const POS = [
  { key: 'w3', label: '待機3', color: '#2f9e44', note: '後ろの待機列（先頭は上）' },
  { key: 'w2', label: '待機2', color: '#1971c2', note: '後ろの待機列（先頭は上）' },
  { key: 'w1', label: '音響待機1', color: '#e8590c', note: '階段を上がった先（先頭は下）' },
  { key: 'stage', label: 'ステージ', color: '#7048e8', note: '今の場面で舞台に立つ子' },
];
const POSMAP = Object.fromEntries(POS.map(p => [p.key, p]));

function blank() { return { version: 2, className: '', title: '', sceneCount: 5, sceneNames: [], roster: [], scenes: {}, cur: 1 }; }
let state;
try { state = JSON.parse(localStorage.getItem(LS_CUR)) || blank(); } catch (e) { state = blank(); }
state = { ...blank(), ...state };
let active = 'stage';        // 今、名前を入れる場所
let onlyLeft = false;        // まだ入っていない子だけ表示
let lastBook = null;         // 読み込んだ名簿（クラスの候補）
function save() { try { localStorage.setItem(LS_CUR, JSON.stringify(state)); } catch (e) { } }

let toastT;
function toast(msg, ms = 2800) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }

/* ---------- 場面ごとの並び ---------- */
function scene(k) {
  const s = state.scenes[k] || (state.scenes[k] = {});
  for (const p of POS) if (!Array.isArray(s[p.key])) s[p.key] = [];
  return s;
}
function posOf(k, id) { const s = scene(k); for (const p of POS) if (s[p.key].includes(id)) return p.key; return null; }
// その場面で、子を場所に入れる（別の場所にいれば移す。同じ場所にいれば外す）
function assign(k, id, key) {
  const s = scene(k); const was = posOf(k, id);
  if (was) s[was] = s[was].filter(x => x !== id);
  if (was !== key) s[key].push(id);
  save();
}
const nameOf = id => (state.roster.find(r => r.id === id) || {}).name || '';
const placedCount = k => { const s = scene(k); return POS.reduce((a, p) => a + s[p.key].filter(id => nameOf(id)).length, 0); };
const sceneLabel = j => `場面${j}` + (state.sceneNames[j - 1] ? `「${state.sceneNames[j - 1]}」` : '');

/* ============================================================
   名簿の読み込み（Numbers / Excel / CSV）
   ・Numbers の表の名前（例：ひまわり組）を、クラス名として表示する
   ・1つのファイルに複数のクラスが入っていても選べる
     - 表やシート（タブ）ごとにクラスが分かれている
     - 「クラス」「組」の列でクラスが分かれている
     - 列の見出しがクラス名（例：ひまわり組｜さくら組）
   ============================================================ */
const NAME_RE = /氏名|名前|なまえ|園児名|児童名|生徒名|^name/i;
const KANA_RE = /ふりがな|フリガナ|よみ|かな|カナ/;
const CLASS_COL_RE = /^(クラス|クラス名|組|組名|学級|class)$/i;
const CLASS_NAME_RE = /組|ぐみ|クラス|class/i;
const DEFAULT_TABLE_RE = /^(表|テーブル|table)\s*\d+([-‐－]\d+)?$/i;
const isNum = v => typeof v === 'number' || /^\s*[0-9０-９]+(\.[0-9]+)?\s*(位|番)?\s*$/.test(String(v));
const clean = v => String(v ?? '').replace(/\s+/g, ' ').trim();

function readClasses(wb, fileBase) {
  const out = [];
  wb.SheetNames.forEach(sn => {
    const ws = wb.Sheets[sn];
    const base = sn.replace(/_\d+$/, '');
    const tname = clean(ws['!tableName']);
    // 表の名前が付いていれば、それをクラス名にする（「表1」のような初めからの名前は使わない）
    const label0 = tname && !DEFAULT_TABLE_RE.test(tname) ? tname : base;
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false, raw: true });
    const h = rows.findIndex(r => r.some(v => clean(v)));
    if (h < 0) return;
    const head = rows[h].map(clean);
    const body = rows.slice(h + 1);
    const width = Math.max(...rows.map(r => r.length));
    const colVals = c => body.map(r => clean(r[c]));
    const textCol = c => { const v = colVals(c).filter(Boolean); return v.length && v.filter(isNum).length / v.length < 0.5; };
    let ni = head.findIndex((x, c) => NAME_RE.test(x) && !KANA_RE.test(x) && textCol(c));
    if (ni < 0) ni = head.findIndex((x, c) => KANA_RE.test(x) && textCol(c));
    const ci = head.findIndex((x, c) => CLASS_COL_RE.test(x) && c !== ni);
    if (ni >= 0 && ci >= 0) {
      const groups = new Map();
      body.forEach(r => { const n = clean(r[ni]); if (!n) return; const k = clean(r[ci]) || '（クラスなし）'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(n); });
      groups.forEach((names, k) => out.push({ label: k, names }));
      return;
    }
    const classCols = [];
    for (let c = 0; c < width; c++) if (CLASS_NAME_RE.test(head[c]) && !NAME_RE.test(head[c]) && !KANA_RE.test(head[c]) && textCol(c)) classCols.push(c);
    if (classCols.length) { classCols.forEach(c => out.push({ label: head[c], names: colVals(c).filter(Boolean) })); return; }
    if (ni < 0) for (let c = 0; c < width; c++) if (textCol(c)) { ni = c; break; }
    if (ni < 0) return;
    const names = colVals(ni).filter(Boolean);
    if (names.length) out.push({ label: label0, names });
  });
  if (out.length === 1 && !CLASS_NAME_RE.test(out[0].label) && CLASS_NAME_RE.test(fileBase)) out[0].label = fileBase;
  const seen = {};
  out.forEach(o => { seen[o.label] = (seen[o.label] || 0) + 1; if (seen[o.label] > 1) o.label += `（${seen[o.label]}）`; });
  return out;
}
async function loadRosterFile(file) {
  $('loadErr').innerHTML = '';
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const classes = readClasses(wb, file.name.replace(/\.[^.]+$/, ''));
    if (!classes.length) throw new Error('名前の列が見つかりませんでした');
    lastBook = { file: file.name, classes };
    $('fileInfo').textContent = '📄 ' + file.name;
    const sel = $('classSel');
    sel.innerHTML = '<option value="">（クラスを選んでください）</option>' + classes.map((c, i) => `<option value="${i}">${esc(c.label)}（${c.names.length}人）</option>`).join('');
    $('classBox').hidden = false;
    if (classes.length === 1) { sel.value = '0'; applyClass(0); }
    else { $('classPreview').textContent = `${classes.length}クラス分の名簿が見つかりました。使うクラスを選んでください。`; sel.focus(); }
  } catch (e) {
    console.error(e);
    $('loadErr').innerHTML = `<div class="err">名簿を読み込めませんでした。1行目に「名前」や「ふりがな」の見出しがある表にしてください。（${esc(e.message || e)}）</div>`;
  }
}
function applyClass(i) {
  const c = lastBook && lastBook.classes[i]; if (!c) return;
  const doIt = () => {
    // 同じ名前の子がいれば、入れた場所を引き継ぐ（名簿を読み直したとき用）
    const byName = new Map(state.roster.map(r => [r.name, r.id]));
    state.roster = c.names.map(n => ({ id: byName.get(n) || uid(), name: n }));
    const keep = new Set(state.roster.map(r => r.id));
    for (const k of Object.keys(state.scenes)) { const s = scene(k); for (const p of POS) s[p.key] = s[p.key].filter(id => keep.has(id)); }
    if (!state.className || state.className === state._autoClass) { state.className = c.label; state._autoClass = c.label; }
    save(); renderAll();
    $('classPreview').textContent = `${c.label}：${c.names.length}人（${c.names.slice(0, 4).join('、')}${c.names.length > 4 ? ' …' : ''}）`;
    toast(`${c.label}（${c.names.length}人）を読み込みました`);
  };
  const hasWork = Object.keys(state.scenes).some(k => placedCount(k));
  if (state.roster.length && hasWork && !sameNames(state.roster.map(r => r.name), c.names)) {
    confirmDlg('名簿を入れ替えますか？', '今の名簿で入れた子のうち、新しい名簿にいない子は、並ぶ場所から外れます。', '入れ替える', doIt);
  } else doIt();
}
const sameNames = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

/* ============================================================
   ページの絵（プレビューとPDFで同じものを使う）A4縦
   ============================================================ */
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
function drawPage(cv, k) {
  const W = cv.width, H = cv.height, mm = W / 210;
  const ctx = cv.getContext('2d');
  ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  const s = scene(k);
  const list = key => s[key].filter(id => nameOf(id));
  const f = (px, w = 400) => `${w} ${px}px ${FONT}`;
  const text = (str, x, y, size, opt = {}) => {
    ctx.font = f(size * mm, opt.w || 400); ctx.fillStyle = opt.c || '#111'; ctx.textAlign = opt.a || 'left';
    if (opt.max) { let sz = size; while (ctx.measureText(str).width > opt.max * mm && sz > 2) { sz -= 0.2; ctx.font = f(sz * mm, opt.w || 400); } }
    ctx.fillText(str, x * mm, y * mm);
    return ctx.measureText(str).width / mm;
  };
  const rect = (x, y, w, h, fill, stroke, lw, r = 0) => {
    ctx.beginPath(); if (r && ctx.roundRect) ctx.roundRect(x * mm, y * mm, w * mm, h * mm, r * mm); else ctx.rect(x * mm, y * mm, w * mm, h * mm);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = (lw || 0.3) * mm; ctx.stroke(); }
  };
  const arrow = (x1, y1, x2, y2, lw, head) => {
    ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; ctx.lineWidth = lw * mm; ctx.lineCap = 'butt';
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x1 * mm, y1 * mm); ctx.lineTo((x2 - Math.cos(a) * head * 0.8) * mm, (y2 - Math.sin(a) * head * 0.8) * mm); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2 * mm, y2 * mm);
    ctx.lineTo((x2 - Math.cos(a - 0.45) * head) * mm, (y2 - Math.sin(a - 0.45) * head) * mm);
    ctx.lineTo((x2 - Math.cos(a + 0.45) * head) * mm, (y2 - Math.sin(a + 0.45) * head) * mm); ctx.closePath(); ctx.fill();
  };

  // ---- 上の見出し：クラス名・タイトル・場面 ----
  const L = 12, R = 198;
  let x = text(state.className || 'クラス名', L, 17, 7.5, { w: 700, max: 80 });
  if (state.title) text(state.title, L + x + 5, 17, 6, { c: '#333', max: R - L - x - 8 });
  rect(L, 22, 30, 11.5, '#111', null, 0, 2.5);
  text(`場面 ${k}`, L + 15, 30.3, 6.6, { w: 700, c: '#fff', a: 'center' });
  x = text(`／ 全${state.sceneCount}場面`, L + 33, 30.3, 4.6, { c: '#333' });
  if (state.sceneNames[k - 1]) text(`「${state.sceneNames[k - 1]}」`, L + 33 + x + 2, 30.5, 6, { w: 700, max: R - (L + 37 + x) - 58 });
  text(POS.slice().reverse().map(p => `${p.label} ${list(p.key).length}人`).join('　'), R, 30.3, 3.2, { a: 'right', c: '#555' });

  // ---- ステージ全体の枠・中央の壁・階段 ----
  const X0 = 12, Y0 = 38, BW = 186, BH = 246;
  ctx.strokeStyle = '#111'; ctx.lineWidth = 0.9 * mm; ctx.strokeRect(X0 * mm, Y0 * mm, BW * mm, BH * mm);
  const col = (a, b) => ({ x: X0 + BW * a, w: BW * (b - a) });
  const C = { w3: col(0.015, 0.225), w2: col(0.235, 0.445), w1: col(0.475, 0.665), stage: col(0.68, 0.985) };
  const WALL = X0 + BW * 0.46;
  ctx.lineWidth = 0.7 * mm; ctx.beginPath(); ctx.moveTo(WALL * mm, (Y0 + 16) * mm); ctx.lineTo(WALL * mm, (Y0 + BH) * mm); ctx.stroke();
  text('壁', WALL - 1.6, Y0 + BH - 3, 2.8, { c: '#666', a: 'right' });
  text('階段', (C.w2.x + C.w1.x + C.w1.w) / 2 - 18, Y0 + 7, 4.2, { w: 700, a: 'center' });
  arrow(C.w2.x + C.w2.w * 0.2, Y0 + 11, C.w1.x + C.w1.w * 0.75, Y0 + 11, 2.2, 5);
  const ST = C.stage, stTop = Y0 + 16, stBot = Y0 + BH - 4;
  rect(ST.x, stTop, ST.w, stBot - stTop, '#fbfaff', '#111', 0.5);

  // ---- 待機列：いちばん人数の多い列に合わせて、文字の大きさをそろえる ----
  const qTop = Y0 + 30, qBot = Y0 + BH - 10;
  const maxQ = Math.max(1, ...['w3', 'w2', 'w1'].map(key => list(key).length));
  const lh = Math.min(8.2, (qBot - qTop) / maxQ);
  const fs = Math.max(2.4, Math.min(4.9, lh * 0.64));
  const header = (key, y) => {
    const p = POSMAP[key], c = C[key];
    rect(c.x, y - 5.2, c.w, 7.2, p.color, null, 0, 1.4);
    text(`${p.label}（${list(key).length}人）`, c.x + 1.6, y, 4, { w: 700, c: '#fff', max: c.w - 3 });
  };
  const nameAt = (key, i, y) => {
    const p = POSMAP[key], c = C[key];
    rect(c.x, y - lh * 0.8, 1.2, lh * 0.95, p.color, null, 0, 0.4);
    text(String(i + 1), c.x + 2.2, y, fs * 0.62, { c: '#888' });
    text(nameOf(list(key)[i]), c.x + 6, y, fs, { w: 500, max: c.w - 7 });
  };
  // 待機3・待機2（先頭は上）
  for (const key of ['w3', 'w2']) {
    header(key, Y0 + 21);
    text('先頭 ↑', C[key].x + C[key].w - 0.5, Y0 + 26.2, 2.8, { a: 'right', c: '#555' });
    list(key).forEach((id, i) => nameAt(key, i, qTop + lh * (i + 0.75)));
  }
  // 音響待機1（先頭は下。下からステージへ進む）
  header('w1', Y0 + 21);
  text('先頭 ↓', C.w1.x + 1, stBot - 1.2, 3.2, { w: 700 });
  arrow(C.w1.x + 15, stBot - 2.3, ST.x - 1.2, stBot - 2.3, 0.8, 2.4);
  list('w1').forEach((id, i) => nameAt('w1', i, qBot - lh * (i + 0.25)));

  // ---- ステージ：四角の中に等間隔で並べる ----
  const sp = POSMAP.stage, st = list('stage');
  rect(ST.x + 2, stTop + 3, ST.w - 4, 8, sp.color, null, 0, 1.4);
  text(`ステージ（${st.length}人）`, ST.x + ST.w / 2, stTop + 8.9, 4.4, { w: 700, c: '#fff', a: 'center' });
  if (st.length) {
    const top = stTop + 14, bot = stBot - 3;
    const cols = st.length > 18 ? 2 : 1;
    const per = Math.ceil(st.length / cols);
    const slot = (bot - top) / per;
    const sfs = Math.max(2.6, Math.min(cols === 2 ? 4.4 : 5.4, slot * 0.6));
    const cw = (ST.w - 4) / cols;
    st.forEach((id, i) => {
      const c = Math.floor(i / per), r = i % per;
      const cx = ST.x + 2 + cw * c + cw / 2;
      const cy = top + slot * (r + 0.5) + sfs * 0.35;
      text(nameOf(id), cx, cy, sfs, { w: 500, a: 'center', max: cw - 2 });
    });
  } else {
    text('（まだ選ばれていません）', ST.x + ST.w / 2, stTop + 24, 3.4, { a: 'center', c: '#c92a2a' });
  }
  // ---- 下のメモ ----
  text('番号は列の先頭からの順番。待機2・待機3は上が先頭、音響待機1は下が先頭です。', X0, Y0 + BH + 5.5, 2.8, { c: '#555', max: BW - 25 });
  text(`${k} / ${state.sceneCount}`, X0 + BW, Y0 + BH + 5.5, 3.2, { a: 'right', c: '#555' });
  ctx.restore();
}

/* ============================================================
   画面の表示
   ============================================================ */
function renderAll() {
  state.cur = Math.min(Math.max(1, state.cur || 1), state.sceneCount);
  $('className').value = state.className || '';
  $('title').value = state.title || '';
  $('scCount').textContent = state.sceneCount;
  renderSceneNames(); renderEditor(); renderPreview();
}
function renderSceneNames() {
  $('scNames').innerHTML = Array.from({ length: state.sceneCount }, (_, i) => `<label>場面${i + 1}<input type="text" data-sn="${i}" value="${esc(state.sceneNames[i] || '')}" placeholder="（なし）"></label>`).join('');
  $('scNames').querySelectorAll('[data-sn]').forEach(inp => inp.addEventListener('input', () => { state.sceneNames[+inp.dataset.sn] = inp.value.trim(); save(); renderTabs(); renderPreview(); }));
}
function renderEditor() {
  const box = $('editor');
  if (!state.roster.length) { box.innerHTML = '<div class="empty">先に、1 でクラスの名簿を読み込んでください。</div>'; return; }
  box.innerHTML = `
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <button type="button" id="tCopy">← 前の場面と同じにする</button>
      <button type="button" id="tClear">この場面を空にする</button>
    </div>
    <div class="boxes" id="boxes"></div>
    <div class="picker">
      <div class="ptitle"><span>名前をタップすると <b id="activeName"></b> に入ります（もう一度タップで外れます）</span>
        <label class="chk"><input type="checkbox" id="onlyLeft" ${onlyLeft ? 'checked' : ''}> まだ入っていない子だけ</label></div>
      <div class="names" id="names"></div>
      <div id="leftInfo"></div>
    </div>`;
  $('tCopy').onclick = copyPrev;
  $('tClear').onclick = () => {
    if (!placedCount(state.cur)) return;
    confirmDlg(`場面${state.cur}を空にしますか？`, 'この場面で入れた子が、すべての場所から外れます。', '空にする', () => { state.scenes[state.cur] = {}; save(); renderScene(); });
  };
  $('onlyLeft').onchange = e => { onlyLeft = e.target.checked; renderNames(); };
  renderScene();
}
function renderScene() { renderTabs(); renderBoxes(); renderNames(); renderPreview(); }
function renderTabs() {
  const t = $('tabs'); if (!t) return;
  t.innerHTML = Array.from({ length: state.sceneCount }, (_, i) => {
    const k = i + 1;
    return `<button type="button" class="${k === state.cur ? 'on' : ''}" data-k="${k}">場面${k}<small>${placedCount(k)}/${state.roster.length}人${state.sceneNames[i] ? '・' + esc(state.sceneNames[i]) : ''}</small></button>`;
  }).join('');
  t.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { state.cur = +b.dataset.k; save(); renderScene(); });
  t.querySelector('.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function renderBoxes() {
  const s = scene(state.cur);
  $('boxes').innerHTML = POS.map(p => `
    <div class="pbox ${p.key === active ? 'on' : ''}" style="--c:${p.color}" data-p="${p.key}" role="button" tabindex="0" aria-pressed="${p.key === active}">
      <div class="ph">${p.label}<small>${s[p.key].length}人</small></div>
      <div class="pnote">${p.note}</div>
      <ol>${s[p.key].filter(id => nameOf(id)).map((id, i, arr) => `<li><span class="no">${i + 1}</span><span class="nm">${esc(nameOf(id))}</span>
        ${i > 0 ? `<button type="button" data-up="${id}" data-from="${p.key}" title="先頭の方へ">↑</button>` : ''}<button type="button" data-rm="${id}" title="外す">✕</button></li>`).join('')}</ol>
      <div class="here">${p.key === active ? '▼ ここに入れます' : 'タップでここに入れる'}</div>
    </div>`).join('');
  $('boxes').querySelectorAll('.pbox').forEach(b => b.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    active = b.dataset.p; renderBoxes(); renderNames();
  }));
  $('boxes').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const k = posOf(state.cur, b.dataset.rm); if (k) assign(state.cur, b.dataset.rm, k); renderScene(); });
  $('boxes').querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    const arr = scene(state.cur)[b.dataset.from]; const i = arr.indexOf(b.dataset.up);
    if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; save(); renderBoxes(); renderPreview(); }
  });
}
function renderNames() {
  const p = POSMAP[active];
  $('activeName').textContent = `「${p.label}」`; $('activeName').style.color = p.color;
  const left = state.roster.filter(r => !posOf(state.cur, r.id));
  const shown = onlyLeft ? left : state.roster;
  $('names').innerHTML = shown.map(r => {
    const k = posOf(state.cur, r.id); const q = k && POSMAP[k];
    return `<button type="button" data-id="${r.id}" class="${k ? 'placed' : ''} ${k === active ? 'here' : ''}" style="--c:${q ? q.color : '#999'}">${esc(r.name)}${q ? `<span class="tag">${q.label}</span>` : ''}</button>`;
  }).join('') || '<div class="hint">全員、どこかに入っています。</div>';
  $('names').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { assign(state.cur, b.dataset.id, active); renderTabs(); renderBoxes(); renderNames(); renderPreview(); });
  $('leftInfo').innerHTML = left.length
    ? `<div class="left">この場面で、まだどこにも入っていない子：${left.length}人（${esc(left.slice(0, 6).map(r => r.name).join('、'))}${left.length > 6 ? ' …' : ''}）</div>`
    : `<div class="left ok">✓ この場面は、クラス全員がどこかに入っています</div>`;
}
function copyPrev() {
  const k = state.cur; if (k <= 1) { toast('場面1には前の場面がありません'); return; }
  const doIt = () => { const p = scene(k - 1); state.scenes[k] = Object.fromEntries(POS.map(x => [x.key, [...p[x.key]]])); save(); renderScene(); toast(`場面${k - 1}と同じ並びにしました。ここから入れ替えてください`); };
  if (placedCount(k)) confirmDlg(`場面${k}を、場面${k - 1}と同じ並びにしますか？`, `場面${k}で入れた内容は、場面${k - 1}の並びで置きかわります。`, '同じにする', doIt);
  else doIt();
}
function renderPreview() {
  const N = state.sceneCount;
  const k = Math.min(Math.max(1, state.cur), N);
  $('pvLabel').textContent = `場面${k} ／ 全${N}場面`;
  $('pvPrev').disabled = k <= 1; $('pvNext').disabled = k >= N;
  drawPage($('pv'), k);
}

/* ============================================================
   PDF の作成（A4縦・場面ごとに1ページ）
   ============================================================ */
async function makePdf() {
  if (!state.roster.length) { toast('先に名簿を読み込んでください'); return; }
  const empty = []; for (let j = 1; j <= state.sceneCount; j++) if (!placedCount(j)) empty.push(j);
  if (empty.length) toast(`場面${empty.join('・')}は、まだ誰も入っていません`, 3500);
  await (document.fonts && document.fonts.ready);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
  const cv = document.createElement('canvas'); cv.width = 1654; cv.height = 2339;   // 約200dpi
  for (let k = 1; k <= state.sceneCount; k++) {
    if (k > 1) pdf.addPage('a4', 'portrait');
    drawPage(cv, k);
    pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    await new Promise(r => setTimeout(r, 0));
  }
  const name = `立ち位置_${state.className || 'クラス'}${state.title ? '_' + state.title : ''}.pdf`.replace(/[\\/:*?"<>|]/g, '');
  const blob = pdf.output('blob');
  const url = URL.createObjectURL(blob);
  const file = new File([blob], name, { type: 'application/pdf' });
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  openDlg(`<div class="dlg"><h3>PDFができました</h3>
    <p style="margin:0">${esc(name)}（${state.sceneCount}ページ）</p>
    <div class="list">
      ${canShare ? '<button type="button" id="pdShare">📤 保存・共有・印刷する<small>「ファイルに保存」や「プリント」を選べます</small></button>' : ''}
      <button type="button" id="pdOpen">📄 PDFを開く</button>
      <a href="${url}" download="${esc(name)}" style="text-decoration:none"><button type="button" style="width:100%;text-align:left">⬇ PDFをダウンロード</button></a>
    </div>
    <div class="acts"><button type="button" data-close>閉じる</button></div></div>`);
  $('pdShare')?.addEventListener('click', () => navigator.share({ files: [file], title: name }).catch(() => {}));
  $('pdOpen').onclick = () => window.open(url, '_blank');
}

/* ============================================================
   データ（この端末の中）：書き出し・読み込み・消す
   ============================================================ */
function dataMenu() {
  openDlg(`<div class="dlg"><h3>データ</h3>
    <p class="hint" style="margin:0">作業中の内容は、この端末の中に自動で保存されています。別のiPadで続きをするときは、ファイルに書き出して読み込みます。</p>
    <div class="list">
      <button type="button" id="dmExp">⬇ ファイルに書き出す（.json）<small>名簿・場面・並びがすべて入ります（園児の名前が入るので扱いに注意）</small></button>
      <button type="button" id="dmImp">📂 ファイルから読み込む</button>
      <button type="button" id="dmClear" style="color:var(--bad)">🗑 この端末からデータを消す<small>名簿と並びをすべて消して、最初からにします</small></button>
    </div>
    <div class="acts"><button type="button" data-close>閉じる</button></div></div>`);
  $('dmExp').onclick = () => {
    const name = `立ち位置データ_${state.className || 'クラス'}${state.title ? '_' + state.title : ''}.json`.replace(/[\\/:*?"<>|]/g, '');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000); closeDlg();
  };
  $('dmImp').onclick = () => { closeDlg(); $('jsonIn').click(); };
  $('dmClear').onclick = () => confirmDlg('この端末からデータを消しますか？', '名簿・場面・並びがすべて消えます。元に戻せません。', '消す', () => {
    try { Object.keys(localStorage).filter(k => k.startsWith(NS)).forEach(k => localStorage.removeItem(k)); } catch (e) { }
    state = blank(); lastBook = null; $('classBox').hidden = true; $('fileInfo').textContent = 'Numbers・Excel・CSV に対応'; renderAll(); toast('消しました');
  });
}
$('jsonIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.roster) || typeof s.scenes !== 'object') throw 0;
    state = { ...blank(), ...s, sceneCount: Math.min(MAX_SCENES, Math.max(1, +s.sceneCount || 1)) };
    save(); renderAll(); toast('読み込みました');
  } catch (err) { toast('このファイルは読み込めませんでした'); }
});

/* ---------- ダイアログ ---------- */
function openDlg(html) { const d = $('dlg'); d.innerHTML = html; d.querySelectorAll('[data-close]').forEach(b => b.onclick = closeDlg); if (!d.open) d.showModal(); }
function closeDlg() { const d = $('dlg'); if (d.open) d.close(); }
function confirmDlg(title, body, okLabel, fn) {
  openDlg(`<div class="dlg"><h3>${esc(title)}</h3><p style="margin:0">${esc(body)}</p><div class="acts"><button type="button" data-close>やめる</button><button type="button" class="primary" id="cfOk">${esc(okLabel)}</button></div></div>`);
  $('cfOk').onclick = () => { closeDlg(); fn(); };
}
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) closeDlg(); });

/* ---------- 操作 ---------- */
$('btnFile').onclick = () => $('fileIn').click();
$('fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadRosterFile(f); });
$('classSel').addEventListener('change', e => { if (e.target.value !== '') applyClass(+e.target.value); });
$('className').addEventListener('input', e => { state.className = e.target.value; save(); renderPreview(); });
$('title').addEventListener('input', e => { state.title = e.target.value; save(); renderPreview(); });
function setCount(n) {
  n = Math.min(MAX_SCENES, Math.max(1, n));
  if (n === state.sceneCount) return;
  state.sceneCount = n;
  if (state.cur > n) state.cur = n;
  save();
  $('scCount').textContent = n;          // 間の数字を変える
  renderSceneNames(); renderEditor(); renderPreview();
}
$('scMinus').onclick = () => {
  const n = state.sceneCount - 1; if (n < 1) return;
  if (placedCount(state.sceneCount)) confirmDlg(`場面${state.sceneCount}を減らしますか？`, `場面${state.sceneCount}で入れた並びは使われなくなります（場面を増やし直すと戻ります）。`, '減らす', () => setCount(n));
  else setCount(n);
};
$('scPlus').onclick = () => { if (state.sceneCount >= MAX_SCENES) { toast(`場面は${MAX_SCENES}までです`); return; } setCount(state.sceneCount + 1); };
$('pvPrev').onclick = () => { if (state.cur > 1) { state.cur--; save(); state.roster.length ? renderScene() : renderPreview(); } };
$('pvNext').onclick = () => { if (state.cur < state.sceneCount) { state.cur++; save(); state.roster.length ? renderScene() : renderPreview(); } };
$('btnPdf').onclick = makePdf;
$('btnMore').onclick = dataMenu;

/* ---------- 起動 ---------- */
renderAll();
if (document.fonts) document.fonts.ready.then(renderPreview);
document.addEventListener('DOMContentLoaded', () => { if (window.DouguLicense) window.DouguLicense.guardApp('oyugikai', '../'); });
// オフライン対応：どうぐばこ共通の仕組み（sw.js）に登録。保存したデータが自動で消されにくくする
if (/^https?:$/.test(location.protocol)) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
</script>
