<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="どうぐばこ">
<meta name="theme-color" content="#2f7d6b">
<title>園のどうぐばこ</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#1f2a2e; --muted:#5d6c70; --line:#d9e3df;
  --accent:#2f7d6b; --accent-soft:#e0f0ea; --net:#b45309; --net-soft:#fff3e0;
  --c-shou:#d47a24; --c-name:#3b74b8; --c-jimu:#5f8a34; --c-card:#bb5283; --c-wait:#a9b4b7;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131a1c; --surface:#1c2427; --ink:#e7eeec; --muted:#9aa9ad; --line:#2b3538;
  --accent:#5db8a1; --accent-soft:#1f3631; --net:#f0a35e; --net-soft:#3a2a17;
  --c-shou:#e39446; --c-name:#5e95d6; --c-jimu:#82ad55; --c-card:#d677a4; --c-wait:#4d585b; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;border-radius:13px;flex:none;display:block}
.top h1{margin:0;font:700 1.45rem/1.2 var(--f-disp)}
.top p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px}
section h2{margin:0 0 12px;font:700 1rem var(--f-disp);display:flex;align-items:baseline;gap:8px}
section h2 small{font:400 .76rem var(--f-body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:none;border:0;padding:4px 0;font:inherit;cursor:pointer;border-radius:12px;position:relative}
.app:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app .tile{width:66px;height:66px;border-radius:17px;display:grid;place-items:center;color:#fff;font:700 1.75rem var(--f-disp);transition:transform .15s}
.app:hover .tile{transform:translateY(-2px)}
.app > span:last-child{font-size:.78rem;line-height:1.3;text-align:center}
.app .net{position:absolute;top:-4px;right:calc(50% - 44px);background:var(--net);color:#fff;font-size:.58rem;font-weight:700;padding:1px 6px;border-radius:999px}
.app.wait .tile{background:var(--c-wait)!important}
.app.wait > span:last-child{color:var(--muted)}
.legend{margin:12px 0 0;font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.legend i{display:inline-block;background:var(--net);color:#fff;font-style:normal;font-size:.6rem;font-weight:700;padding:0 6px;border-radius:999px;margin-right:4px;vertical-align:1px}
.privacy{background:var(--accent-soft);border-radius:14px;padding:12px 16px;font-size:.84rem;line-height:1.7}
.privacy b{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="icon.svg" alt="">
    <div><h1>園のどうぐばこ</h1><p>幼稚園のための道具をひとまとめに（試作版）</p></div>
  </div>

  <section>
    <h2>使えるアプリ</h2>
    <div class="grid">
      <a class="app" href="marathon/"><span class="tile" style="background:var(--c-shou)">賞</span><span>マラソン大会<br>表彰状</span></a>
      <a class="app" href="busroute/"><em class="net">ネット</em><span class="tile" style="background:var(--c-jimu)">車</span><span>バスルート<br>計画</span></a>
    </div>
    <p class="legend"><span><i>ネット</i>地図などのためにインターネットを使うアプリ（園児の情報は送りません）</span></p>
  </section>

  <section>
    <h2>準備中のアプリ <small>これから増えていきます</small></h2>
    <div class="grid" id="wait"></div>
  </section>

  <div class="privacy">🔒 名簿・印鑑・コースなど、アプリで使うデータは<b>この端末（iPad・パソコン）の中だけ</b>に保存されます。どうぐばこのサーバーに送られることはありません。</div>
</div>
<div id="toast" role="status"></div>
<script>
const WAIT = [
  ['運', '運動会の賞状', 'shou'], ['皆', '皆勤賞', 'shou'], ['修', '修了証書', 'shou'], ['卒', '卒園証書', 'shou'],
  ['名', '名札', 'name'], ['貼', '持ち物シール', 'name'], ['靴', '下駄箱ラベル', 'name'], ['絵', '作品ラベル', 'name'],
  ['出', '出席簿', 'jimu'], ['席', '座席表', 'jimu'], ['誕', '誕生日カード', 'card'], ['番', '行事プログラム', 'card'],
];
document.getElementById('wait').innerHTML = WAIT.map(([k, n]) =>
  `<button class="app wait" type="button" data-n="${n}"><span class="tile">${k}</span><span>${n}</span></button>`).join('');
let tt;
document.getElementById('wait').addEventListener('click', e => {
  const b = e.target.closest('.app'); if (!b) return;
  const t = document.getElementById('toast'); t.textContent = `「${b.dataset.n}」は準備中です`; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2000);
});
</script>
</body>
</html>
