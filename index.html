<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 安全のための決まり：このページは自分のサイト以外と通信しない -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="どうぐばこ">
<meta name="theme-color" content="#2f7d6b">
<title>どうぐばこ</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<script defer src="common/license.js"></script>
<style>
/* 見出しの書体（どうぐばこの画面で使う文字だけの小さな版。サイトに置いてあり、オフラインでも使える） */
@font-face{font-family:"Zen Maru Gothic Box";font-weight:500;font-display:swap;src:url(fonts/ZenMaruGothic-box-500.woff2) format("woff2")}
@font-face{font-family:"Zen Maru Gothic Box";font-weight:700;font-display:swap;src:url(fonts/ZenMaruGothic-box-700.woff2) format("woff2")}
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#1f2a2e; --muted:#5d6c70; --line:#d9e3df;
  --accent:#2f7d6b; --accent-ink:#ffffff; --accent-soft:#e0f0ea; --net:#b45309;
  --bad:#c92a2a; --bad-soft:#fdecec; --warn:#9a5b00; --warn-soft:#fff4dc;
  --c-shou:#d47a24; --c-jimu:#5f8a34; --c-wait:#a9b4b7; --demo:#6741d9; --demo-soft:#efeafd;
  --f-disp:"Zen Maru Gothic Box","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131a1c; --surface:#1c2427; --ink:#e7eeec; --muted:#9aa9ad; --line:#2b3538;
  --accent:#5db8a1; --accent-ink:#0f1f1b; --accent-soft:#1f3631; --net:#f0a35e;
  --bad:#ff8787; --bad-soft:#3a1f1f; --warn:#f0b35e; --warn-soft:#3a2e17;
  --c-shou:#e39446; --c-jimu:#82ad55; --c-wait:#4d585b; --demo:#b197fc; --demo-soft:#2a2340; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(90px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ---- 共通：中央のカード（ログインなど） ---- */
.center{min-height:calc(100vh - 120px);display:grid;place-items:center}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.card .logo{width:84px;height:84px;border-radius:21px;display:block;margin:0 auto 2px}
.card h1{margin:0;text-align:center;font:700 1.4rem/1.3 var(--f-disp)}
.card h2{margin:0;text-align:center;font:700 1.15rem/1.4 var(--f-disp)}
.card p{margin:0;font-size:.88rem;color:var(--muted);text-align:center;line-height:1.7}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
.fld input{width:100%;font-size:16px;font-weight:400;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.fld input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.code{letter-spacing:.5em;text-align:center;font-size:24px!important;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:.85rem;padding:2px;text-decoration:underline}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:.85rem}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--muted)}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.note{font-size:.78rem;color:var(--muted);line-height:1.7;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.demohint{font-size:.8rem;background:var(--demo-soft);color:var(--demo);border-radius:12px;padding:10px 12px;line-height:1.7}
.demohint b{font-variant-numeric:tabular-nums}
.demohint .accts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.demohint button{border:1px solid var(--demo);background:var(--surface);color:var(--demo);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer}

/* ---- 許可証を受け取る ---- */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;align-items:center;font-size:.92rem;color:var(--muted)}
.steps li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem;flex:none}
.steps li.doing{color:var(--ink)}
.steps li.doing i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.pass{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.pass dt{color:var(--muted)}
.pass dd{margin:0;font-weight:600}
.big-ok{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.8rem;margin:0 auto}
.big-ng{width:56px;height:56px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-size:1.7rem;margin:0 auto}

/* ---- メニュー ---- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:52px;height:52px;border-radius:13px;flex:none;display:block}
.top .ttl{margin-right:auto}
.top h1{margin:0;font:700 1.45rem/1.2 var(--f-disp)}
.top p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;font-size:.8rem;text-align:left;line-height:1.3}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.chip.warn .dot{background:var(--warn)}
.chip small{display:block;color:var(--muted);font-size:.72rem}
section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px}
section h2{margin:0 0 12px;font:700 1rem var(--f-disp);display:flex;align-items:baseline;gap:8px}
section h2 small{font:400 .76rem var(--f-body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:none;border:0;padding:4px 0;font:inherit;cursor:pointer;border-radius:12px;position:relative}
.app:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app .tile{width:66px;height:66px;border-radius:17px;display:grid;place-items:center;color:#fff;transition:transform .15s}
.app .tile svg{width:46px;height:46px;display:block}
.app:hover .tile{transform:translateY(-2px)}
.app > span:last-child{font-size:.78rem;line-height:1.3;text-align:center}
.app .net{position:absolute;top:-4px;right:calc(50% - 44px);background:var(--net);color:#fff;font-size:.58rem;font-weight:700;padding:1px 6px;border-radius:999px;font-style:normal}
.app .lock{position:absolute;top:-6px;left:calc(50% - 42px);font-size:.95rem;font-style:normal}
.app.locked .tile{background:var(--c-wait)!important}
.app.soon .tile{background:var(--c-wait)}
.app.soon > span:last-child{color:var(--muted)}
.app .badge{position:absolute;top:-5px;right:calc(50% - 46px);background:var(--muted);color:var(--surface);font-size:.58rem;font-weight:700;padding:1px 6px;border-radius:999px;font-style:normal}
.app.locked > span:last-child{color:var(--muted)}
.legend{margin:12px 0 0;font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.legend i{display:inline-block;background:var(--net);color:#fff;font-style:normal;font-size:.6rem;font-weight:700;padding:0 6px;border-radius:999px;margin-right:4px;vertical-align:1px}
.privacy{background:var(--accent-soft);border-radius:14px;padding:12px 16px;font-size:.84rem;line-height:1.7}
.privacy b{color:var(--accent)}
.adminlink{text-align:center;margin:4px 0 0;font-size:.8rem}
.adminlink a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:inline-block}

/* ---- ダイアログ・お知らせ ---- */
dialog{border:0;border-radius:20px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font:700 1.1rem var(--f-disp)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom) + 70px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:14px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:50}
#toast.show{opacity:1}
.offbar{position:sticky;top:0;z-index:20;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:6px 12px;font-size:.8rem;text-align:center;margin:0 auto 12px;max-width:980px}

/* ---- 試作の体験メニュー ---- */
#demoBtn[hidden]{display:none}
#demoBtn{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:40;background:var(--demo);color:#fff;border:0;border-radius:999px;padding:11px 16px;font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.demo h3{color:var(--demo)}
.demo p{margin:0;font-size:.8rem;color:var(--muted);line-height:1.6}
.demo .grp{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.demo .grp b{font-size:.85rem}
.demo .acts{display:flex;flex-wrap:wrap;gap:6px}
.demo .acts button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.8rem;cursor:pointer}
.demo .acts button.on{background:var(--demo);color:#fff;border-color:var(--demo)}
.demo .now{font-size:.78rem;background:var(--demo-soft);border-radius:10px;padding:8px 10px;line-height:1.7}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.steps li.doing i{animation:none}}
</style>
</head>
<body>
<div id="offbar" class="offbar" hidden>📴 ネットを切った状態を再現しています（体験メニューで戻せます）</div>
<main id="screen"></main>
<button id="demoBtn" type="button" hidden>🧪 試作の体験メニュー</button>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<!-- アプリの一覧（先生用・管理者用のメニューで共通） -->
<script src="common/apps.js"></script>
<script>
'use strict';
let L = null; // 共通部品（common/license.js）が読み込まれてから入る
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = t => new Date(t).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
const fmtDT = t => new Date(t).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const daysLeft = pl => Math.max(0, Math.ceil((pl.exp - Date.now()) / L.DAY));
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
function show(html) { $('#screen').innerHTML = html; $('#offbar').hidden = !(L.loginRequired && L.isOffline()); window.scrollTo(0, 0); }
const ERR = {
  bad_login: 'メールアドレスかパスワードが違います。',
  ended: 'この園のご契約は終了しています。園の管理者にお問い合わせください。',
  stopped: 'このアカウントは利用が停止されています。園の管理者にお問い合わせください。',
  offline: 'インターネットにつながっていません。つながる場所でもう一度お試しください。',
  bad_code: '確認コードが違います。メールに書かれた6けたの数字を入れてください。',
  expired_code: '確認コードの有効期限が切れました。もう一度ログインしてください。',
};

/* ============================================================
   起動：どうぐばこを開いたとき
   ・許可証が有効 → すぐメニュー（必要なら裏で更新）
   ・許可証がない → ログイン
   ・期限切れ → 更新を試す（ネットがなければ案内）
   ============================================================ */
async function boot() {
  // ログインなしで使う設定（common/license.js の LOGIN_REQUIRED = false）のときは、すぐメニューを出す
  $('#demoBtn').hidden = !L.loginRequired;
  if (!L.loginRequired) {
    // 体験メニューを出さないので、以前の「ネットを切った状態の再現」が残っていたら解除する
    try { L.demo && L.demo.setOffline(false); } catch (e) { }
    return showMenu(L.profile || { orgName: '明青幼稚園', staff: '', plan: 'standard', apps: ['marathon', 'busroute', 'oyugikai'] });
  }
  const st = await L.status();
  if (st.state === 'none' || st.state === 'bad') { if (st.state === 'bad') L.logout(); return showLogin(st.state === 'bad' ? '利用許可証を確認できなかったため、ログインし直してください。' : ''); }
  if (st.state === 'expired') {
    show(`<div class="center"><div class="card"><img class="logo" src="icon.svg" alt=""><h2>利用許可証を更新しています…</h2></div></div>`);
    const r = await L.renew();
    if (r.result === 'ok') { toast('利用許可証を更新しました'); return showMenu(r.payload); }
    return showBlocked(r.result, st.payload);
  }
  showMenu(st.payload);
  if (L.needsRenew(st.payload)) backgroundRenew(st.payload);
}
async function backgroundRenew(prev) {
  const r = await L.renew();
  if (r.result === 'ok') {
    if (r.payload.plan !== prev.plan) { toast(`プランが「${L.PLANS[r.payload.plan].name}」に変わりました`); showMenu(r.payload); return; }
    showMenu(r.payload);
    toast('（試作の表示）裏で利用許可証を自動更新しました。ふだんは表示されません', 3800);
  } else if (r.result === 'ended' || r.result === 'stopped') showBlocked(r.result, prev);
  // offline のときは何もしない（期限まではそのまま使える）
}

/* ---------- ログイン ---------- */
function showLogin(errMsg, email = '') {
  show(`<div class="center"><form class="card" id="fLogin" novalidate>
    <img class="logo" src="icon.svg" alt="">
    <h1>どうぐばこ</h1>
    <p>園から届いた招待メールに書かれた<br>メールアドレスとパスワードでログインします。</p>
    ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ''}
    <label class="fld">メールアドレス<input id="em" type="email" autocomplete="username" inputmode="email" value="${esc(email)}" placeholder="例：sensei@example.com"></label>
    <label class="fld">パスワード<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn" id="bLogin" type="submit">ログイン</button>
    <div style="text-align:center"><button class="linkbtn" type="button" id="forgot">パスワードを忘れたとき</button></div>
    <div class="demohint">🧪 試作版のため、本物のアカウントはありません。下のボタンでデモ用のアカウントを入力できます（パスワードはすべて demo1234）。
      <div class="accts"><button type="button" data-em="demo@example.com">スタンダードの園</button><button type="button" data-em="light@example.com">ライトの園</button><button type="button" data-em="ended@example.com">契約が終わった園</button></div></div>
    <div class="note">🔒 ログインで送るのは、メールアドレスとパスワードだけです。名簿や印鑑などのデータは、この端末の中だけで使われます。</div>
  </form></div>`);
  $('#fLogin').querySelectorAll('[data-em]').forEach(b => b.onclick = () => { $('#em').value = b.dataset.em; $('#pw').value = 'demo1234'; $('#bLogin').focus(); });
  $('#forgot').onclick = () => toast('本番では、パスワードを作り直すためのメールが届きます（試作では未対応）', 3500);
  $('#fLogin').onsubmit = async e => {
    e.preventDefault();
    const em = $('#em').value.trim(), pw = $('#pw').value;
    if (!em || !pw) { toast('メールアドレスとパスワードを入れてください'); return; }
    const b = $('#bLogin'); b.disabled = true; b.textContent = '確認しています…';
    try {
      const r = await L.login(em, pw);
      if (r.needCode) showCode(r, em); else showIssuing(true);
    } catch (err) { showLogin(ERR[err.code] || 'ログインできませんでした。', em); }
  };
  setTimeout(() => (email ? $('#pw') : $('#em')).focus(), 50);
}

/* ---------- 確認コード（2段階認証） ---------- */
function showCode(r, email, errMsg) {
  show(`<div class="center"><form class="card" id="fCode" novalidate>
    <img class="logo" src="icon.svg" alt="">
    <h2>確認コードを入れてください</h2>
    <p><b>${esc(r.sentTo)}</b> に、6けたの確認コードをメールで送りました。</p>
    ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ''}
    <label class="fld">確認コード<input id="cd" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label>
    <label class="check"><input type="checkbox" id="trust" checked> この端末を信頼する（30日間は確認コードを省略します。共用のiPadでは外してください）</label>
    <button class="btn" id="bCode" type="submit">確認する</button>
    <div style="text-align:center"><button class="linkbtn" type="button" id="back">ログイン画面に戻る</button></div>
    <div class="demohint">🧪 試作版のためメールは届きません。確認コードは <b>${esc(r.demoCode)}</b> です。<br><button type="button" id="fill" style="margin-top:6px">コードを入力する</button></div>
  </form></div>`);
  $('#fill').onclick = () => { $('#cd').value = r.demoCode; $('#bCode').focus(); };
  $('#back').onclick = () => showLogin('', email);
  $('#cd').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
  $('#fCode').onsubmit = async e => {
    e.preventDefault();
    const b = $('#bCode'); b.disabled = true; b.textContent = '確認しています…';
    try { await L.confirm(r.ticket, $('#cd').value, $('#trust').checked); showIssuing(false); }
    catch (err) { if (err.code === 'expired_code') showLogin(ERR.expired_code, email); else showCode(r, email, ERR[err.code] || '確認できませんでした。'); }
  };
  setTimeout(() => $('#cd').focus(), 50);
}

/* ---------- 許可証を受け取る（端末に保存） ---------- */
async function showIssuing(skippedCode) {
  show(`<div class="center"><div class="card">
    <img class="logo" src="icon.svg" alt="">
    <h2>この端末で使えるようにしています</h2>
    ${skippedCode ? '<p>信頼済みの端末のため、確認コードを省略しました。</p>' : ''}
    <ul class="steps" id="steps">
      <li><i></i>園のご契約を確認</li>
      <li><i></i>利用許可証を受け取る</li>
      <li><i></i>この端末に保存</li>
    </ul></div></div>`);
  const lis = [...document.querySelectorAll('#steps li')];
  for (const li of lis) { li.className = 'doing'; await sleep(550); li.className = 'done'; li.querySelector('i').textContent = '✓'; }
  await sleep(250);
  const st = await L.status();
  const pl = st.payload;
  show(`<div class="center"><div class="card">
    <div class="big-ok">✓</div>
    <h2>準備ができました</h2>
    <dl class="pass">
      <dt>園</dt><dd>${esc(pl.orgName)}</dd>
      <dt>先生</dt><dd>${esc(pl.staff)}</dd>
      <dt>プラン</dt><dd>${esc(L.PLANS[pl.plan].name)}（${pl.apps.map(a => esc(L.APP_NAMES[a])).join('・')}）</dd>
      <dt>有効期限</dt><dd>${fmtDate(pl.exp)}</dd>
    </dl>
    <p>この日までは、インターネットにつながっていなくても使えます。<br>期限が近づくと、どうぐばこを開いたときに自動で更新されます。</p>
    <button class="btn" id="go" type="button">どうぐばこを開く</button>
  </div></div>`);
  $('#go').onclick = () => showMenu(pl);
  $('#go').focus();
}

/* ---------- 使えないとき ---------- */
function showBlocked(kind, pl) {
  const m = {
    offline: ['インターネットにつないでください', `利用許可証の期限（${pl ? fmtDate(pl.exp) : ''}）が切れています。インターネットにつながる場所で開くと、自動で更新されます。`, '<button class="btn" id="retry" type="button">もう一度試す</button>'],
    ended: ['ご利用期間が終了しました', '園のご契約が終了したため、どうぐばこのアプリは使えなくなりました。この端末に保存した名簿などのデータは、端末の中に残っています。', '<button class="btn ghost" id="relogin" type="button">ログイン画面へ</button>'],
    stopped: ['このアカウントは利用が停止されています', '園の管理者が、このアカウントの利用を止めました。心当たりがない場合は、園の管理者にお問い合わせください。', '<button class="btn ghost" id="relogin" type="button">ログイン画面へ</button>'],
    error: ['確認できませんでした', '時間をおいて、もう一度お試しください。', '<button class="btn" id="retry" type="button">もう一度試す</button>'],
  }[kind] || ['確認できませんでした', '', '<button class="btn" id="retry" type="button">もう一度試す</button>'];
  show(`<div class="center"><div class="card">
    <div class="big-ng">${kind === 'offline' ? '📴' : '!'}</div>
    <h2>${m[0]}</h2><p>${m[1]}</p>${m[2]}</div></div>`);
  $('#retry')?.addEventListener('click', boot);
  $('#relogin')?.addEventListener('click', () => { L.logout(); showLogin(''); });
}

/* ---------- メニュー ---------- */
// アプリの一覧は common/apps.js（先生用・管理者用のメニューで共通）。ここには先生用（for: 'all'）だけを出す
const DA = window.DouguApps;
const ICONS = DA.ICONS, SOON = DA.SOON;
const APPS = DA.forTeachers().map(a => ({ ...a, href: a.path }));
function showMenu(pl) {
  const near = L.loginRequired && daysLeft(pl) <= 7;
  show(`<div class="wrap">
    <div class="top">
      <img src="icon.svg" alt="">
      <div class="ttl"><h1>どうぐばこ</h1><p>${esc(pl.orgName)}</p></div>
      ${L.loginRequired ? `<button class="chip ${near ? 'warn' : ''}" id="chip" type="button"><span class="dot"></span><span>${esc(pl.staff)}<small>${esc(L.PLANS[pl.plan].name)}プラン・あと${daysLeft(pl)}日有効</small></span></button>` : ''}
    </div>
    <section>
      <h2>使えるアプリ</h2>
      <div class="grid">${APPS.map(a => {
        const ok = pl.apps.includes(a.id);
        return ok ? `<a class="app" href="${a.href}">${a.net ? '<em class="net">ネット</em>' : ''}<span class="tile" style="background:${a.color}">${ICONS[a.id]}</span><span>${a.n}</span></a>`
          : `<button class="app locked" type="button" data-lock="${a.id}"><em class="lock">🔒</em><span class="tile">${ICONS[a.id]}</span><span>${a.n}</span></button>`;
      }).join('')}</div>
      <p class="legend">${APPS.some(a => a.net) ? '<span><i>ネット</i>地図などのためにインターネットを使うアプリ（園児の情報は送りません）</span>' : ''}${APPS.some(a => !pl.apps.includes(a.id)) ? '<span>🔒 今のプランでは使えないアプリ</span>' : ''}</p>
    </section>
    <section>
      <h2>準備中のアプリ <small>これから増えていきます</small></h2>
      <div class="grid">${SOON.map(a => `<button class="app soon" type="button" data-soon="${esc(a.name)}"><em class="badge">準備中</em><span class="tile">${ICONS[a.id]}</span><span>${a.n}</span></button>`).join('')}</div>
    </section>
    <div class="privacy">🔒 名簿・印鑑・コースなど、アプリで使うデータは<b>この端末（iPad・パソコン）の中だけ</b>に保存されます。どうぐばこのサーバーに送られることはありません。</div>
    <p class="adminlink"><a href="kanri/">🔑 管理者用どうぐばこ</a></p>
  </div>`);
  $('#chip')?.addEventListener('click', () => accountDialog(pl));
  document.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast(`「${b.dataset.soon}」は準備中です。できあがったら、ここから使えるようになります`, 3200));
  document.querySelectorAll('[data-lock]').forEach(b => b.onclick = () => {
    const plan = Object.values(L.PLANS).find(p => p.apps.includes(b.dataset.lock));
    openDlg(`<div class="dlg"><h3>🔒 ${L.APP_NAMES[b.dataset.lock]}</h3><p style="margin:0;font-size:.9rem;line-height:1.7">このアプリは<b>${plan.name}プラン</b>で使えます。園の管理者がプランを変更すると、次にどうぐばこを開いたときから使えるようになります。</p><div class="row"><button class="btn" data-close type="button">閉じる</button></div></div>`);
  });
}
function accountDialog(pl) {
  openDlg(`<div class="dlg"><h3>アカウントと利用許可証</h3>
    <dl class="pass">
      <dt>園</dt><dd>${esc(pl.orgName)}</dd>
      <dt>先生</dt><dd>${esc(pl.staff)}</dd>
      <dt>メール</dt><dd style="word-break:break-all">${esc(pl.sub)}</dd>
      <dt>プラン</dt><dd>${esc(L.PLANS[pl.plan].name)}</dd>
      <dt>有効期限</dt><dd>${fmtDate(pl.exp)}（あと${daysLeft(pl)}日）</dd>
      <dt>最終確認</dt><dd>${L.lastChecked() ? fmtDT(L.lastChecked()) : '—'}</dd>
    </dl>
    <p style="margin:0;font-size:.8rem;color:var(--muted);line-height:1.7">期限までは、インターネットにつながっていなくても使えます。期限の7日前からと、1日に1回、どうぐばこを開いたときに自動で確認・更新します。</p>
    <div class="row"><button class="btn ghost" id="logout" type="button">ログアウト</button><button class="btn" data-close type="button">閉じる</button></div></div>`);
  $('#logout').onclick = () => {
    openDlg(`<div class="dlg"><h3>ログアウトしますか？</h3><p style="margin:0;font-size:.9rem;line-height:1.7">この端末の利用許可証を消します。アプリを使うには、もう一度ログインが必要です。<br>名簿や印鑑などのデータは消えません。</p>
      <div class="row"><button class="btn ghost" data-close type="button">やめる</button><button class="btn" id="doLogout" type="button">ログアウト</button></div></div>`);
    $('#doLogout').onclick = () => { closeDlg(); L.logout(); showLogin(''); toast('ログアウトしました'); };
  };
}
function openDlg(html) { const d = $('#dlg'); d.innerHTML = html; d.querySelectorAll('[data-close]').forEach(b => b.onclick = closeDlg); if (!d.open) d.showModal(); }
function closeDlg() { const d = $('#dlg'); if (d.open) d.close(); }
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) closeDlg(); });

/* ============================================================
   試作の体験メニュー（本番にはありません）
   いろいろな状況を再現して、使い心地を確かめるためのもの
   ============================================================ */
async function demoMenu() {
  const D = L.demo; const S = D.server;
  const st = await L.status(); const pl = st.payload; const email = D.currentEmail();
  const orgId = email && S.orgOf(email); const org = orgId && S.org(orgId);
  const stateText = { none: 'ログインしていません', bad: '許可証が書き換えられています', expired: '許可証の期限が切れています', ok: '有効な許可証があります' }[st.state] || st.state;
  openDlg(`<div class="dlg demo"><h3>🧪 試作の体験メニュー</h3>
    <p>いろいろな状況を再現できます。操作すると「どうぐばこを開き直した」ときの動きになります。</p>
    <div class="now">今の状態：<b>${stateText}</b>${pl ? `<br>${esc(pl.orgName)}／${esc(pl.staff)}／${esc(L.PLANS[pl.plan].name)}／期限 ${fmtDate(pl.exp)}` : ''}${L.isOffline() ? '<br>📴 ネットを切った状態' : ''}</div>
    <div class="grp"><b>インターネット</b><p>ネットがないときでも、許可証の期限内ならそのまま使えます。</p>
      <div class="acts"><button type="button" class="${L.isOffline() ? '' : 'on'}" data-a="online">つながっている</button><button type="button" class="${L.isOffline() ? 'on' : ''}" data-a="offline">ネットを切る</button></div></div>
    ${email ? `
    <div class="grp"><b>許可証の期限</b><p>「期限が近い」にすると、開いたときに裏で自動更新されます。「期限切れ」はネットがあれば自動で更新、なければ案内が出ます。</p>
      <div class="acts"><button type="button" data-a="near">期限が近い（あと2日）</button><button type="button" data-a="expire">期限切れにする</button><button type="button" data-a="tamper">許可証を書き換える</button></div></div>
    <div class="grp"><b>園の管理者・会社側の操作</b><p>次に許可証を確認したとき（開いたとき）に反映されます。</p>
      <div class="acts">
        <button type="button" data-a="plan" data-p="${org && org.plan === 'standard' ? 'light' : 'standard'}">プランを「${org && org.plan === 'standard' ? 'ライト' : 'スタンダード'}」に変える</button>
        <button type="button" data-a="${org && org.active ? 'end' : 'resume'}">${org && org.active ? '園の契約を終了する' : '園の契約を再開する'}</button>
        <button type="button" data-a="${S.isStopped(email) ? 'unstop' : 'stop'}">${S.isStopped(email) ? 'この先生の停止を解除' : 'この先生の利用を停止'}</button>
      </div></div>` : `<div class="grp"><b>園の管理者・会社側の操作</b><p>ログインすると操作できます。「契約が終わった園」のアカウントでログインを試すこともできます。</p>
      <div class="acts"><button type="button" data-a="resumeAll">契約が終わった園を再開する</button></div></div>`}
    <div class="grp"><b>アプリを直接開く</b><p>ホーム画面からではなく、アプリのURLを直接開いたときの動きです（許可証がないと使えません）。</p>
      <div class="acts"><a href="marathon/" style="text-decoration:none"><button type="button">マラソン表彰状を開く</button></a><a href="busroute/" style="text-decoration:none"><button type="button">バスルートを開く</button></a></div></div>
    <div class="grp"><div class="acts"><button type="button" data-a="reset">体験を最初からやり直す</button><button type="button" data-close>閉じる</button></div></div>
  </div>`);
  document.querySelectorAll('.demo [data-a]').forEach(b => b.onclick = async () => {
    const a = b.dataset.a; let msg = '';
    if (a === 'online') { D.setOffline(false); msg = 'ネットにつながった状態にしました'; }
    if (a === 'offline') { D.setOffline(true); msg = 'ネットを切った状態にしました'; }
    if (a === 'near') { await D.setExpiry(Date.now() + 2 * L.DAY); msg = '許可証の期限を「あと2日」にしました'; }
    if (a === 'expire') { await D.setExpiry(Date.now() - 60000); msg = '許可証を期限切れにしました'; }
    if (a === 'tamper') { D.tamper(); msg = '許可証の中身を書き換えました（プランを勝手に上げた想定）'; }
    if (a === 'plan') { S.setPlan(orgId, b.dataset.p); D.forceRecheck(); msg = `園のプランを「${L.PLANS[b.dataset.p].name}」に変えました`; }
    if (a === 'end') { S.setActive(orgId, false); D.forceRecheck(); msg = '園の契約を終了しました'; }
    if (a === 'resume') { S.setActive(orgId, true); D.forceRecheck(); msg = '園の契約を再開しました'; }
    if (a === 'resumeAll') { S.setActive('aozora', true); msg = '「あおぞら幼稚園」の契約を再開しました'; }
    if (a === 'stop') { S.setStopped(email, true); D.forceRecheck(); msg = 'この先生の利用を停止しました'; }
    if (a === 'unstop') { S.setStopped(email, false); D.forceRecheck(); msg = 'この先生の停止を解除しました'; }
    if (a === 'reset') { D.resetAll(); msg = '体験を最初からやり直します'; }
    closeDlg();
    toast(msg + ' → どうぐばこを開き直します', 2200);
    await sleep(900);
    boot();
  });
}
$('#demoBtn').onclick = demoMenu;

// オフライン対応：一度開いたアプリを端末に保存する（sw.js）。端末に保存したデータが自動で消されにくくする
if (/^https?:$/.test(location.protocol)) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
document.addEventListener('DOMContentLoaded', () => {
  L = window.DouguLicense;
  if (!L) show('<div class="center"><div class="card"><h2>読み込みに失敗しました</h2><p>common/license.js が見つかりません。</p></div></div>');
  else boot();
});
</script>
</body>
</html>
