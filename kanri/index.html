<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 安全のための決まり：このページは自分のサイト以外と通信しない -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="どうぐばこ">
<meta name="theme-color" content="#2f7d6b">
<meta name="robots" content="noindex">
<title>どうぐばこ（管理者用）</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<!-- アプリの一覧（先生用・管理者用のメニューで共通） -->
<script src="../common/apps.js"></script>
<style>
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#1f2a2e; --muted:#5d6c70; --line:#d9e3df;
  --accent:#2f7d6b; --accent-ink:#ffffff; --accent-soft:#e0f0ea; --net:#b45309; --admin:#8a5a00; --admin-soft:#fff4dc;
  --bad:#c92a2a; --bad-soft:#fdecec; --c-wait:#a9b4b7;
  --f-disp:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",sans-serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131a1c; --surface:#1c2427; --ink:#e7eeec; --muted:#9aa9ad; --line:#2b3538;
  --accent:#5db8a1; --accent-ink:#0f1f1b; --accent-soft:#1f3631; --net:#f0a35e; --admin:#f0b35e; --admin-soft:#3a2e17;
  --bad:#ff8787; --bad-soft:#3a1f1f; --c-wait:#4d585b; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.back{display:inline-block;color:#fff;background:var(--accent);text-decoration:none;font-weight:700;border-radius:8px;padding:8px 12px;font-size:.9rem}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:52px;height:52px;border-radius:13px;flex:none;display:block}
.top .ttl{margin-right:auto}
.top h1{margin:0;font:700 1.45rem/1.2 var(--f-disp)}
.top p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.badge-admin{display:inline-block;background:var(--admin-soft);color:var(--admin);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;margin-left:6px;vertical-align:3px}
section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px}
section.admin{border-color:var(--admin);box-shadow:0 0 0 3px var(--admin-soft)}
section h2{margin:0 0 12px;font:700 1rem var(--f-disp);display:flex;align-items:baseline;gap:8px}
section h2 small{font:400 .76rem var(--f-body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:none;border:0;padding:4px 0;font:inherit;cursor:pointer;border-radius:12px;position:relative}
.app:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app .tile{width:66px;height:66px;border-radius:17px;display:grid;place-items:center;color:#fff}
.app .tile svg{width:46px;height:46px;display:block}
.app > span:last-child{font-size:.78rem;line-height:1.3;text-align:center}
.app .net{position:absolute;top:-4px;right:calc(50% - 44px);background:var(--net);color:#fff;font-size:.58rem;font-weight:700;padding:1px 6px;border-radius:999px;font-style:normal}
.legend{margin:12px 0 0;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;background:var(--net);color:#fff;font-style:normal;font-size:.6rem;font-weight:700;padding:0 6px;border-radius:999px;margin-right:4px;vertical-align:1px}
.center{min-height:calc(100vh - 140px);display:grid;place-items:center}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.card .logo{width:84px;height:84px;border-radius:21px;display:block;margin:0 auto 2px}
.card h2{margin:0;text-align:center;font:700 1.3rem/1.3 var(--f-disp)}
.card p{margin:0;font-size:.88rem;color:var(--muted);text-align:center;line-height:1.7}
.card input{width:100%;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;letter-spacing:.08em}
.card input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400;font-size:.85rem;padding:8px 16px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:.85rem;text-align:center}
.foot{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div><a class="back" href="../">← どうぐばこ</a></div>
  <main id="screen"></main>
</div>

<script>
'use strict';
const D = window.DouguApps;
const $ = s => document.querySelector(s);
const tile = a => `<a class="app" href="../${a.path}">${a.net ? '<em class="net">ネット</em>' : ''}<span class="tile" style="background:${a.color}">${D.ICONS[a.id] || ''}</span><span>${a.n}</span></a>`;

// 合言葉を入れる画面
function showGate(err) {
  $('#screen').innerHTML = `<div class="center"><form class="card" id="fGate" autocomplete="off">
    <img class="logo" src="../icon.svg" alt="">
    <h2>管理者用どうぐばこ</h2>
    <p>園長・管理職の方のためのページです。<br>合言葉を入れてください。</p>
    ${err ? '<div class="err">合言葉が違います。もう一度入れてください。</div>' : ''}
    <input type="password" id="pass" aria-label="合言葉" placeholder="合言葉" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn" type="submit">開く</button>
    <p style="font-size:.78rem">一度入れると、この端末では次から聞かれません。</p>
  </form></div>`;
  $('#fGate').onsubmit = async e => {
    e.preventDefault();
    const ok = await D.tryPasscode($('#pass').value);
    if (ok) showMenu(); else showGate(true);
  };
  setTimeout(() => $('#pass').focus(), 50);
}
// 管理者用のメニュー
function showMenu() {
  const admin = D.forAdmins(), all = D.forTeachers();
  $('#screen').innerHTML = `<div class="wrap">
    <div class="top">
      <img src="../icon.svg" alt="">
      <div class="ttl"><h1>どうぐばこ<span class="badge-admin">管理者用</span></h1><p>明青幼稚園</p></div>
    </div>
    <section class="admin">
      <h2>管理者用のアプリ <small>先生用のどうぐばこには出ません</small></h2>
      <div class="grid">${admin.map(tile).join('') || '<p class="legend">今はありません</p>'}</div>
      ${admin.some(a => a.net) ? '<p class="legend"><i>ネット</i>地図などのためにインターネットを使うアプリ（園児の情報は送りません）</p>' : ''}
    </section>
    <section>
      <h2>みんなのアプリ <small>先生用のどうぐばこと同じもの</small></h2>
      <div class="grid">${all.map(tile).join('')}</div>
    </section>
    <div class="foot"><button class="btn ghost" id="lock" type="button">🔒 この端末の合言葉を消す</button></div>
  </div>`;
  $('#lock').onclick = () => { D.adminLogout(); showGate(); };
}

D.adminOk() ? showMenu() : showGate();
// オフライン対応：どうぐばこ共通の仕組み（sw.js）に登録
if (/^https?:$/.test(location.protocol)) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
</script>
</body>
</html>
