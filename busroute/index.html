<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 安全のための決まり：通信できるのは、地図（国土地理院）・道順（OSRM）・住所検索（国土地理院・OpenStreetMap）だけ -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cyberjapandata.gsi.go.jp; connect-src 'self' https://router.project-osrm.org https://nominatim.openstreetmap.org https://msearch.gsi.go.jp; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バスルート">
<meta name="theme-color" content="#1f2328">
<title>バスルート計画</title>
<!-- 地図の部品（Leaflet 1.9.4）と並べ替えの部品（Sortable 1.15.2）は、どうぐばこのサイトに置いたものを使う（オフラインでも開ける） -->
<link rel="stylesheet" href="../vendor/leaflet/leaflet.min.css">
<link rel="manifest" href="../manifest.webmanifest">
<script src="../vendor/leaflet/leaflet.min.js"></script>
<script src="../vendor/sortable/Sortable.min.js"></script>
<!-- どうぐばこ共通：利用許可証（どうぐばこと同じ場所に置いたときだけ読み込まれる） -->
<script defer src="../common/license.js"></script>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e3e6ea; --accent:#2563eb;
  --warn:#b45309; --warnbg:#fff7e6; --bad:#c92a2a; --badbg:#fff0f0; --ok:#2b8a3e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px}
button:hover{background:#f0f3f7}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#1d4fd7}
button.on{background:#1f2328;color:#fff;border-color:#1f2328}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],input[type=time],select{border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:#fff}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));background:#1f2328;color:#fff;flex-wrap:wrap}
.sl{display:none}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
header .scn{display:flex;align-items:center;gap:6px;color:#cbd5e1}
header .scn input{background:#2d333b;border-color:#444c56;color:#fff;width:200px}
header button{background:#2d333b;border-color:#444c56;color:#fff}
header button:hover{background:#3a424c}
header .sp{flex:1}
#main{flex:1;display:flex;min-height:0}
aside{width:460px;min-width:360px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;padding:10px;background:#fff;border-bottom:3px solid transparent;font-weight:600;color:var(--muted)}
.tabs button.act{border-bottom-color:var(--accent);color:var(--ink)}
#side{overflow:auto;padding:12px;flex:1}
#mapwrap{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#map{flex:1;min-height:200px}
.maptools{position:absolute;top:10px;left:56px;right:64px;z-index:800;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.maptools > *{pointer-events:auto}
.maptools .box{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:4px;display:flex;gap:4px;align-items:center}
.maptools .box button{border:0;padding:5px 9px}
.maptools .box button.on{background:#1f2328;color:#fff}
.search{position:relative}
.search input{width:220px;border:0;outline:0}
.sresults{position:absolute;top:100%;left:0;width:340px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-height:300px;overflow:auto;margin-top:4px}
.sresults div{padding:6px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px}
.sresults div:hover{background:#f0f5ff}
.addhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:800;background:#1f2328;color:#fff;padding:8px 14px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px}
.adding #map{cursor:crosshair}
/* board */
#board{height:44%;min-height:220px;border-top:2px solid #1f2328;background:#fafbfc;display:flex;flex-direction:column}
#board.hidden{display:none}
.board-h{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line)}
.board-h b{font-size:14px}
.board-h .hint{color:var(--muted);font-size:12px;flex:1}
.cols{flex:1;display:flex;gap:8px;padding:8px;overflow-x:auto;min-height:0}
.col{min-width:190px;width:190px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.col-h{padding:6px 8px;border-top:5px solid;border-radius:8px 8px 0 0;border-bottom:1px solid var(--line)}
.col-h .t{font-weight:700;font-size:13px}
.col-h .s{font-size:11px;color:var(--muted)}
.col ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;min-height:40px}
.col li{background:#fff;border:1px solid var(--line);border-left:4px solid;border-radius:5px;padding:4px 6px;margin-bottom:4px;font-size:12px;cursor:grab;display:flex;gap:4px;align-items:center}
.col li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col li .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.col li.via{font-style:italic;opacity:.75}
.sortable-ghost{opacity:.35}
/* side */
h3{font-size:13px;margin:16px 0 8px;color:var(--muted);font-weight:700;letter-spacing:.03em}
h3:first-child{margin-top:0}
.buscard{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.bus-h{background:#f3f4f6;padding:6px 10px;font-weight:700;display:flex;justify-content:space-between;font-size:13px}
.bus-h span{font-weight:400;color:var(--muted)}
.rrow{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer}
.rrow:hover{background:#f7f9fc}
.rrow .nm{font-weight:700}
.rrow .nm small{font-weight:400;color:var(--muted)}
.rrow .meta{font-size:12px;color:var(--muted)}
.rrow .tm{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.rrow .tm b{font-size:15px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.warn{background:var(--warnbg);color:var(--warn);padding:6px 10px;font-size:12px;border-top:1px solid #fde2b5}
.bad{background:var(--badbg);color:var(--bad);padding:6px 10px;font-size:12px;border-top:1px solid #ffd0d0}
.okline{color:var(--ok);padding:6px 10px;font-size:12px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:2px solid;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;background:#fff}
.chip.act{color:#fff}
.routehead{border:1px solid var(--line);border-left:6px solid;border-radius:8px;padding:8px 10px;display:grid;gap:6px;margin-bottom:10px}
.routehead .r1{display:flex;gap:6px;align-items:center}
.routehead .r1 input.nm{font-weight:700;font-size:15px;flex:1;min-width:0}
.routehead .r1 input.ar{flex:1;min-width:0}
.routehead .r2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.routehead input[type=time]{width:92px}
.routehead input[type=color]{width:32px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;font-weight:400;color:var(--muted)}
.bar{height:5px;background:#eef0f3;border-radius:3px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.over{background:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tools button{font-size:12px;padding:4px 9px}
.stoplist{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.srow{display:grid;grid-template-columns:16px 24px 1fr 44px 44px 46px 30px 24px;gap:4px;align-items:center;padding:4px 6px;border-top:1px solid var(--line);background:#fff;font-size:13px}
.srow.head{background:#f3f4f6;font-size:11px;color:var(--muted);border-top:0}
.srow.school{background:#fafafa;font-weight:700}
.srow .handle{cursor:grab;color:#9ca3af;text-align:center;user-select:none}
.srow .num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer}
.srow .num.via{width:12px;height:12px;border-radius:2px;transform:rotate(45deg);margin-left:5px}
.srow input.nm{width:100%;border-color:transparent;padding:2px 4px}
.srow input.nm:hover,.srow input.nm:focus{border-color:var(--line)}
.srow.isvia input.nm{font-style:italic;color:var(--muted)}
.srow .tm{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.srow .orig{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.srow .orig.late{color:var(--bad)} .srow .orig.early{color:var(--ok)}
.srow input.pax{width:100%;padding:2px 3px;text-align:right}
.srow select.mv{width:100%;padding:1px;font-size:11px}
.srow .del{border:0;background:none;color:#9ca3af;padding:0;font-size:14px}
.srow .del:hover{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin:8px 0}
.poolrow{display:flex;gap:6px;align-items:center;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.poolrow .n{flex:1}
.pill{display:inline-block;font-size:10px;padding:0 6px;border-radius:10px;background:#eef2ff;color:#3b5bdb;margin-left:4px;vertical-align:1px}
.pill.gray{background:#f1f3f5;color:#868e96}
/* map icons */
.pin-wrap{background:none;border:0}
.pin{width:100%;height:100%;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font:700 12px/1 sans-serif}
.pin.dim{opacity:.55;font-size:10px}
.pin.pool{background:#868e96;color:#fff;border-style:dashed}
.via{width:100%;height:100%;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.school-pin{width:100%;height:100%;background:#1f2328;color:#fff;border:2px solid #fff;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font:700 14px/1 sans-serif}
.leaflet-tooltip.stip{padding:1px 6px;font-size:12px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.leaflet-tooltip.stip b{font-variant-numeric:tabular-nums}
.pp{width:262px;display:grid;gap:6px;font-size:13px}
.pp *{box-sizing:border-box}
.pp .h{font-weight:700;border-left:5px solid;padding-left:6px;overflow-wrap:anywhere}
.pp label{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:6px}
.pp input[type=text],.pp input[type=number],.pp select{width:100%;min-width:0;max-width:100%}
.pp label.cb{display:flex;align-items:flex-start;gap:6px;font-size:12px}
.pp label.cb input{margin-top:3px;flex:none}
.pp .times{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pp .row{display:flex;gap:4px;flex-wrap:wrap}
.pp .row button{flex:1 1 70px;min-width:0;padding:3px;white-space:nowrap}
.pp .row button.danger{color:var(--bad)}
/* dialog */
dialog{border:0;border-radius:12px;padding:0;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:640px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-h{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:14px 16px;max-height:70vh;overflow:auto}
.dlg-b table{border-collapse:collapse;width:100%}
.dlg-b td,.dlg-b th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.dlg-b .f{display:grid;grid-template-columns:200px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.dlg-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.help li{margin-bottom:6px}
#toast{position:fixed;bottom:20px;right:20px;background:#1f2328;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:420px}
#toast.show{opacity:1}
#toast.act{pointer-events:auto}
#toast button{margin-left:10px;background:#fff;color:#1f2328;border:0;font-weight:700}
.cand{position:absolute;top:60px;left:56px;z-index:900;width:400px;max-width:calc(100% - 70px);max-height:calc(100% - 80px);background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;flex-direction:column}
.cand[hidden]{display:none}
.cand-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.cand-h button{border:0;padding:2px 6px}
.cand-note{font-size:12px;color:var(--muted);padding:6px 12px}
.cand-list{overflow:auto;padding:0 10px;flex:1;min-height:0}
.cand-item{border:2px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.cand-item:hover{border-color:#adb5bd}
.cand-item.sel{border-color:var(--c);background:#fafcff;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.cand-item .ct{font-weight:700}
.cand-item .badge{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;align-items:center;justify-content:center;font-size:11px;margin-right:2px}
.cand-item .cm{font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.cand-item .cd{font-size:12px;color:var(--muted)}
.cand-item .co{font-size:11px;color:#495057;margin-top:4px;line-height:1.6}
.cand-item .co .new{background:#fff3bf;font-weight:700;padding:0 3px;border-radius:3px}
.cand-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.pin.prev{background:#1f2328;color:#fff;border-color:#fff}
.pin.prev.newpin{background:#fab005;color:#1f2328}
/* print */
#print-area{position:fixed;left:-20000px;top:0;width:700px;background:#fff}
.page{width:700px;padding:10px 0;page-break-after:always;break-after:page}
.page h1{font-size:18px;white-space:nowrap;letter-spacing:-.02em;text-align:center;border-bottom:3px double #000;padding-bottom:4px;margin:0 0 14px}
.page .top{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.page table{border-collapse:collapse;flex:1;font-size:13px}
.page th,.page td{border:1px solid #000;padding:3px 6px;font-weight:700}
.page td.t{font-variant-numeric:tabular-nums;width:62px}
.page .bus{border:1px solid #000;padding:8px;width:230px;font-weight:700;font-size:13px}
.page .bus img{display:block;width:100%;margin-top:8px}
.bphoto{width:64px;height:44px;object-fit:cover;border-radius:4px;vertical-align:middle;border:1px solid var(--line)}
.page .pmap{width:700px;height:600px;border:1px solid #000}
.page .foot{font-size:10px;color:#555;margin-top:4px}
.rpt h1{margin-bottom:6px}
.rpt .rmeta{font-size:11px;color:#333;margin-bottom:10px}
.rpt h2{font-size:15px;border-left:8px solid #000;padding-left:6px;margin:14px 0 6px}
.rpt h2 small{font-weight:400;font-size:12px}
.rpt h2.plain{border-left-color:#1f2328}
.rpt table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:6px}
.rpt th,.rpt td{border:1px solid #000;padding:2px 4px;font-weight:400;vertical-align:middle}
.rpt th{background:#eee;font-weight:700}
.rpt td.c{text-align:center}
.rpt td.t{white-space:nowrap;font-variant-numeric:tabular-nums;width:92px}
.rpt .was{color:#666;text-decoration:line-through}
.rpt small.late{color:#c92a2a;margin-left:2px} .rpt small.early{color:#2b8a3e;margin-left:2px}
.rpt .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.rpt .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.rpt .kpis div{border:1.5px solid #000;border-radius:6px;text-align:center;padding:4px;font-size:11px}
.rpt .kpis b{display:block;font-size:22px}
.rpt .items{font-size:12px;margin:4px 0;padding-left:20px}
.rpt .items li{margin:1px 0}
.rpt .note2{font-size:10.5px;color:#444}
.rpt .meta{font-size:12px;margin:2px 0 6px;padding-left:20px}
.rpt .nochg{font-size:12px;color:#444;margin:2px 0 6px}
.rpt .rblock{break-inside:avoid}
.rpt tr.sch td{background:#f6f6f6;font-weight:700}
.rpt .k-new td,.rpt .legend .k-new{background:#e3f6e8}
.rpt .k-mod td,.rpt .legend .k-mod{background:#fff3cd}
.rpt .k-time td,.rpt .legend .k-time{background:#e8f1fd}
.rpt .k-del td,.rpt .legend .k-del{background:#fde4e4}
.rpt .k-del td:nth-child(2){text-decoration:line-through}
.rpt .legend{font-size:11px;margin-top:8px;display:flex;gap:8px}
.rpt .legend span{padding:1px 8px;border:1px solid #999}
.leaflet-tooltip.ptip{background:#fff;border:1.5px solid #000;border-radius:0;padding:0 4px;font:700 12px sans-serif;box-shadow:none;color:#000}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  #app,dialog,#toast{display:none!important}
  #print-area{position:static;left:auto;width:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ---- タブレット（iPad）対応 ---- */
body.side-hidden aside{display:none}
@media (max-width:1280px){
  aside{width:390px;min-width:330px}
  header h1 .t2,header .scn .lb{display:none}
  header .scn input{width:150px}
  .ll{display:none} .sl{display:inline}
}
@media (max-width:900px){
  #main{flex-direction:column-reverse}
  aside{width:100%;min-width:0;height:42%;border-right:0;border-top:2px solid #1f2328;padding-bottom:env(safe-area-inset-bottom)}
  body.side-big aside{height:68%}
  .cand{left:10px;max-width:calc(100% - 20px)}
  #board{height:50%}
}
/* タッチ操作（指で押しやすい大きさ。iOSで入力時に画面が拡大されないよう文字は16px） */
body.touch input[type=text],body.touch input[type=number],body.touch input[type=time],body.touch select{font-size:16px}
body.touch button{min-height:36px}
body.touch header button{min-width:40px}
body.touch .tools button{padding:7px 11px}
body.touch .maptools .box button{padding:8px 11px}
body.touch .srow{grid-template-columns:24px 26px minmax(0,1fr) 46px 40px 52px 40px 30px;padding:6px}
body.touch .srow .handle{font-size:20px;touch-action:none}
body.touch .srow input.nm{border-color:var(--line)}
body.touch .srow select.mv{font-size:16px;width:40px}
body.touch .srow .del{font-size:18px}
body.touch .col li{padding:9px 8px;font-size:13px}
body.touch .chip{padding:6px 12px;font-size:13px}
body.touch .rrow{padding:10px}
body.touch .rrow .vis{width:20px;height:20px}
body.touch .cand-item{padding:10px 12px}
body.touch .pp .row button{min-height:38px}
body.touch .leaflet-control-layers-toggle{width:44px;height:44px}
.routehead,.routehead>*{min-width:0}
.routehead .r1{flex-wrap:wrap}

<script>
'use strict';
/* ============================================================
   どうぐばこ共通（将来は全アプリ共通の部品として切り出す）
   ・保存の名前は「dougubako.<アプリ名>.」で始める（同じ箱のアプリ同士でぶつからないように）
   ・大きなデータ（写真など）は IndexedDB の共通の保管庫に入れる
   ・データはこの端末の中だけ。会社のサーバーには送らない
   ============================================================ */
const BOX = {
  appId: 'busroute',
  ns: 'dougubako.busroute.',
  homeUrl: '../',
  // 利用許可証の確認は共通部品（common/license.js）が行う。端末の中の許可証を確かめるだけで、通信はしない
};
const KV = (() => {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('dougubako', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => db().then(d => new Promise((res, rej) => { const q = fn(d.transaction('kv', mode).objectStore('kv')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }));
  return {
    get: k => run('readonly', s => s.get(BOX.ns + k)).catch(() => undefined),
    set: (k, v) => run('readwrite', s => s.put(v, BOX.ns + k)),
    del: k => run('readwrite', s => s.delete(BOX.ns + k)).catch(() => undefined),
  };
})();
// この端末からこのアプリのデータを全部消す
async function eraseAllData() {
  try { Object.keys(localStorage).filter(k => k.startsWith(BOX.ns)).forEach(k => localStorage.removeItem(k)); } catch (e) { }
  await KV.del('photos');
}

/* ============================================================
   基本設定
   ============================================================ */
const LS_CUR = BOX.ns + 'current.v1';
const LS_SAVED = BOX.ns + 'saved.v1';
const LS_CACHE = BOX.ns + 'osrm.v1';
const LS_HELP = BOX.ns + 'helpShown';
// 園のまわり（南北約50km・東西約50km）だけを地図と検索の範囲にする
function areaBounds() {
  const s = state.school; if (!s) return null;
  return L.latLngBounds([s.lat - 0.22, s.lng - 0.27], [s.lat + 0.22, s.lng + 0.27]);
}
const PAT_LABEL = { am: '登園', pm: '降園', half: '午前保育 降園' };
const PAT_SHORT = { am: '登園', pm: '降園', half: '午前' };

const $ = s => document.querySelector(s);
const uid = () => 's' + Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toMin(t) { if (!t) return 0; const [h, m] = String(t).replace('：', ':').split(':').map(Number); return h * 60 + (m || 0); }
function fmt(min) { const m = Math.round(min); return Math.floor(m / 60) + ':' + String(((m % 60) + 60) % 60).padStart(2, '0'); }
function hhmm(t) { const m = toMin(t); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function km(m) { return (m / 1000).toFixed(1); }
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function textOn(hex) {
  const h = hex.replace('#', ''); const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 165 ? '#1f2328' : '#fff';
}

/* ============================================================
   データのひな形
   ・最初は空っぽ。初回の「初期設定」で園の位置・バスを登録する
   ・「サンプルで試す」は動きを試すためのデータ（園名は明青幼稚園。場所・停留所・コースは架空）
   ============================================================ */
function S(name, orig, lat, lng) { return { id: uid(), name, lat, lng, pax: 0, via: false, orig }; }
const ROUTE_COLORS = ['#f08c00', '#1c7ed6', '#e64980', '#2f9e44', '#7048e8', '#e03131', '#1098ad', '#5c940d'];
function fiscalYearLabel() {
  const d = new Date(); const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  return `${y}年度（令和${y - 2018}年）`;
}
function defaultSettings() { return { factor: null, dwell: 1, buffer: 5, yearLabel: fiscalYearLabel(), base: 'pale', city: '' }; }
function blankState() { return { version: 1, name: '新しい案', school: null, settings: defaultSettings(), buses: [], routes: [], pool: [] }; }
function sampleState() {
  const st = { version: 1, name: 'サンプル案', sample: true,
    school: { name: '明青幼稚園', lat: 35.6690, lng: 139.4776 },
    settings: { ...defaultSettings(), city: '' },
    buses: [
      { id: 'b1', name: '大型バス（青）', capacity: 39, phone: '' },
      { id: 'b2', name: 'ワゴン', capacity: 13, phone: '' },
    ],
    routes: [
      { id: 'r1', name: 'そらコース', area: '北西方面', busId: 'b1', trip: 1, color: '#1c7ed6', visible: true,
        start: { am: '8:00', pm: '14:00', half: '11:00' }, origEnd: null, stops: [
          S('けやき公園前', null, 35.6765, 139.4650),
          S('さくら通り二丁目', null, 35.6800, 139.4700),
          S('ひばり団地入口', null, 35.6830, 139.4760),
          S('中央図書館前', null, 35.6790, 139.4820),
        ] },
      { id: 'r2', name: 'うみコース', area: '南方面', busId: 'b1', trip: 2, color: '#f08c00', visible: true,
        start: { am: '8:45', pm: '14:45', half: '11:45' }, origEnd: null, stops: [
          S('みなみ児童館前', null, 35.6595, 139.4760),
          S('ポプラ通り', null, 35.6605, 139.4700),
          S('すずかけ公園', null, 35.6625, 139.4655),
          S('にしまち三丁目', null, 35.6660, 139.4640),
        ] },
      { id: 'r3', name: 'もりコース', area: '東方面', busId: 'b2', trip: 1, color: '#2f9e44', visible: true,
        start: { am: '8:10', pm: '14:10', half: '11:10' }, origEnd: null, stops: [
          S('ひがし公民館前', null, 35.6700, 139.4920),
          S('こもれび坂上', null, 35.6740, 139.4980),
          S('あおば町一丁目', null, 35.6680, 139.5010),
        ] },
    ],
    pool: [],
  };
  return st;
}

// バスの写真（印刷用）。端末内の共通保管庫（IndexedDB）に保存
let photos = {};
KV.get('photos').then(v => { photos = v || {}; });
function savePhotos() { return KV.set('photos', photos); }
function busPhoto(id) { return photos[id] || ''; }

/* ============================================================
   状態・履歴・保存
   ============================================================ */
let state;
try { state = JSON.parse(localStorage.getItem(LS_CUR)) || blankState(); } catch (e) { state = blankState(); }
const ui = { mode: 'all', sel: state.routes[0]?.id, pat: 'am', adding: false, board: false, popupStop: null, moveSchool: false };
const hist = { past: [], future: [] };

function save() { try { localStorage.setItem(LS_CUR, JSON.stringify(state)); } catch (e) { } }
function commit(fn) {
  hist.past.push(JSON.stringify(state)); if (hist.past.length > 200) hist.past.shift();
  hist.future = [];
  fn(); save(); render();
}
function replaceState(ns) { commit(() => { state = ns; }); if (!getRoute(ui.sel)) ui.sel = state.routes[0]?.id; render(); }
function undo() { if (!hist.past.length) return; hist.future.push(JSON.stringify(state)); state = JSON.parse(hist.past.pop()); if (!getRoute(ui.sel)) ui.sel = state.routes[0]?.id; save(); render(); toast('元に戻しました'); }
function redo() { if (!hist.future.length) return; hist.past.push(JSON.stringify(state)); state = JSON.parse(hist.future.pop()); save(); render(); toast('やり直しました'); }

const getRoute = id => state.routes.find(r => r.id === id);
const getBus = id => state.buses.find(b => b.id === id);
function getList(id) { return id === '__pool' ? state.pool : getRoute(id).stops; }
function findStop(sid) {
  for (const r of state.routes) { const i = r.stops.findIndex(s => s.id === sid); if (i >= 0) return { listId: r.id, list: r.stops, idx: i, stop: r.stops[i], route: r }; }
  const i = state.pool.findIndex(s => s.id === sid);
  if (i >= 0) return { listId: '__pool', list: state.pool, idx: i, stop: state.pool[i], route: null };
  return null;
}
function routePts(r) { return [state.school, ...r.stops, state.school]; }
function factor() { return state.settings.factor ?? 1.3; }
function sortedRoutes() {
  const bo = id => state.buses.findIndex(b => b.id === id);
  return [...state.routes].sort((a, b) => bo(a.busId) - bo(b.busId) || a.trip - b.trip);
}
// 一番遠回りにならない位置に挿入
function insertBest(list, stop, isRoute = true) {
  if (!isRoute || !list.length) { list.push(stop); return list.length - 1; }
  const pts = [state.school, ...list, state.school];
  let best = 0, bestCost = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const c = haversine(pts[i], stop) + haversine(stop, pts[i + 1]) - haversine(pts[i], pts[i + 1]);
    if (c < bestCost) { bestCost = c; best = i; }
  }
  list.splice(best, 0, stop); return best;
}
function moveStop(sid, toId, toIndex) {
  const f = findStop(sid); if (!f) return;
  f.list.splice(f.idx, 1);
  if (f.listId !== toId) f.stop.orig = null;
  const dest = getList(toId);
  if (toIndex == null) insertBest(dest, f.stop, toId !== '__pool'); else dest.splice(toIndex, 0, f.stop);
}

/* ============================================================
   経路計算（OSRM）
   ============================================================ */
const calc = {}; const inflight = {};
let routeCache = {};
try { routeCache = JSON.parse(localStorage.getItem(LS_CACHE)) || {}; } catch (e) { routeCache = {}; }
function keyOf(pts) { return pts.map(p => p.lng.toFixed(5) + ',' + p.lat.toFixed(5)).join(';'); }
function cacheSet(key, v) {
  routeCache[key] = { ...v, t: Date.now() };
  const ks = Object.keys(routeCache);
  if (ks.length > 120) ks.sort((a, b) => routeCache[a].t - routeCache[b].t).slice(0, ks.length - 120).forEach(k => delete routeCache[k]);
  try { localStorage.setItem(LS_CACHE, JSON.stringify(routeCache)); } catch (e) { routeCache = {}; }
}
function approxCalc(pts, key, status) {
  const legs = [];
  for (let i = 0; i < pts.length - 1; i++) { const d = haversine(pts[i], pts[i + 1]) * 1.35; legs.push({ dur: d / 6.4, dist: d }); }
  return { key, legs, geom: null, status };
}
function legsFor(r) {
  const pts = routePts(r); const key = keyOf(pts); const c = calc[r.id];
  if (c && c.key === key) return c;
  return approxCalc(pts, key, 'loading');
}
let queue = Promise.resolve();
async function fetchRoute(pts) {
  const coords = pts.map(p => p.lng.toFixed(6) + ',' + p.lat.toFixed(6)).join(';');
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    if (!res.ok) throw new Error(res.status);
    const j = await res.json(); if (j.code !== 'Ok') throw new Error(j.code);
    const rt = j.routes[0];
    await sleep(150);
    return { legs: rt.legs.map(l => ({ dur: l.duration, dist: l.distance })), geom: rt.geometry.coordinates.map(c => [+c[1].toFixed(5), +c[0].toFixed(5)]) };
  } catch (e) { await sleep(600); return null; }
}
function ensureCalcs() {
  for (const r of state.routes) {
    const pts = routePts(r); const key = keyOf(pts);
    if (calc[r.id]?.key === key || inflight[r.id] === key) continue;
    if (!r.stops.length) { calc[r.id] = { key, status: 'ok', legs: [{ dur: 0, dist: 0 }], geom: null }; continue; }
    if (routeCache[key]) { calc[r.id] = { key, status: 'ok', legs: routeCache[key].legs, geom: routeCache[key].geom }; continue; }
    inflight[r.id] = key;
    const rid = r.id;
    queue = queue.then(async () => {
      const cur = getRoute(rid);
      if (!cur || keyOf(routePts(cur)) !== key) { if (inflight[rid] === key) delete inflight[rid]; return; }
      const res = await fetchRoute(pts);
      if (inflight[rid] === key) delete inflight[rid];
      if (res) cacheSet(key, res);
      const now = getRoute(rid);
      if (now && keyOf(routePts(now)) === key) calc[rid] = res ? { key, status: 'ok', ...res } : approxCalc(pts, key, 'approx');
      requestRender();
      afterCalc();
    });
  }
}
function retryRouting() { for (const k in calc) if (calc[k].status === 'approx') delete calc[k]; render(); toast('経路を再取得しています…'); }

function timingCore(stops, legs, startStr, f, dw) {
  const t0 = toMin(startStr); let t = t0; const arr = [];
  stops.forEach((s, i) => { t += (legs[i]?.dur || 0) * f / 60; arr.push(t); if (!s.via) t += dw; });
  t += (legs[stops.length]?.dur || 0) * f / 60;
  return { arr, end: t, total: t - t0, dist: legs.reduce((a, l) => a + (l.dist || 0), 0) };
}
function timing(r, pat) {
  const c = legsFor(r);
  return { ...timingCore(r.stops, c.legs, r.start[pat], factor(), +state.settings.dwell || 0), status: c.status };
}
function paxOf(r) { return r.stops.reduce((a, s) => a + (s.via ? 0 : (+s.pax || 0)), 0); }
function stopCount(r) { return r.stops.filter(s => !s.via).length; }

// 現行ダイヤに合わせて補正係数を推定
function calibrate(silent) {
  let num = 0, den = 0, n = 0;
  for (const r of state.routes) {
    if (!r.origEnd) continue;
    const c = calc[r.id]; if (!c || c.status !== 'ok' || c.key !== keyOf(routePts(r))) continue;
    num += toMin(r.origEnd) - toMin(r.start.am) - stopCount(r) * (+state.settings.dwell || 0);
    den += c.legs.reduce((a, l) => a + l.dur, 0) / 60; n++;
  }
  if (!n || den <= 0) { if (!silent) toast('経路の計算が終わってから実行してください'); return null; }
  const f = Math.min(3, Math.max(0.8, Math.round(num / den * 100) / 100));
  return f;
}
function afterCalc() {
  if (state.settings.factor == null && state.routes.every(r => calc[r.id]?.status === 'ok' && calc[r.id].key === keyOf(routePts(r)))) {
    const f = calibrate(true);

function busChecks() {
  // 同じバスで前の便の園到着＋余裕時間 が 次の便の出発 より遅くないか
  const out = [];
  for (const b of state.buses) {
    const rs = state.routes.filter(r => r.busId === b.id).sort((a, c) => a.trip - c.trip);
    for (let i = 0; i < rs.length - 1; i++) {
      for (const p of ['am', 'pm', 'half']) {

      }
    }
  }
  return out;
}

/* ============================================================
   最適化・Googleマップ
   ============================================================ */
/* ---------- 道路の所要時間行列（OSRM table） ---------- */
const matrixCache = {};
async function getMatrix(pts) {
  const key = keyOf(pts);
  if (matrixCache[key]) return matrixCache[key];
  try {
    const coords = pts.map(p => p.lng.toFixed(6) + ',' + p.lat.toFixed(6)).join(';');
    const res = await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?annotations=duration,distance`);
    const j = await res.json(); if (j.code !== 'Ok') throw 0;
    return matrixCache[key] = { dur: j.durations, dist: j.distances, approx: false };
  } catch (e) {
    const dist = pts.map(a => pts.map(b => haversine(a, b) * 1.35));
    return { dur: dist.map(r => r.map(d => d / 6.4)), dist, approx: true };
  }
}
// seq: 停留所の番号(1..n)の並び。0 は園
function seqCost(seq, M) {
  let d = 0, ds = 0, p = 0;
  for (const i of seq) { d += M.dur[p][i] || 0; ds += M.dist[p][i] || 0; p = i; }
  d += M.dur[p][0] || 0; ds += M.dist[p][0] || 0;
  return { dur: d, dist: ds };
}
// 全体最短（13か所までは厳密解、それ以上は近似）
function solveTSP(n, M) {
  if (n <= 1) return n ? [1] : [];
  if (n <= 13) {
    const N = 1 << n, INF = 1e15;
    const dp = new Float64Array(N * n).fill(INF), par = new Int8Array(N * n).fill(-1);
    for (let j = 0; j < n; j++) dp[(1 << j) * n + j] = M.dur[0][j + 1];
    for (let mask = 1; mask < N; mask++) for (let j = 0; j < n; j++) {
      const v = dp[mask * n + j]; if (v >= INF || !(mask & (1 << j))) continue;
      for (let k = 0; k < n; k++) { if (mask & (1 << k)) continue; const nm = mask | (1 << k), nv = v + M.dur[j + 1][k + 1]; if (nv < dp[nm * n + k]) { dp[nm * n + k] = nv; par[nm * n + k] = j; } }
    }
    let best = INF, last = -1;
    for (let j = 0; j < n; j++) { const v = dp[(N - 1) * n + j] + M.dur[j + 1][0]; if (v < best) { best = v; last = j; } }
    const seq = []; let mask = N - 1, j = last;
    while (j >= 0) { seq.unshift(j + 1); const pj = par[mask * n + j]; mask ^= (1 << j); j = pj; }
    return seq;
  }
  let seq = []; const used = new Set(); let cur = 0;
  for (let k = 0; k < n; k++) { let b = -1, bd = Infinity; for (let j = 1; j <= n; j++) if (!used.has(j) && M.dur[cur][j] < bd) { bd = M.dur[cur][j]; b = j; } used.add(b); seq.push(b); cur = b; }
  let improved = true;
  while (improved) {
    improved = false;
    for (let i = 0; i < n - 1; i++) for (let j = i + 1; j < n; j++) {
      const ns = [...seq.slice(0, i), ...seq.slice(i, j + 1).reverse(), ...seq.slice(j + 1)];
      if (seqCost(ns, M).dur < seqCost(seq, M).dur - 0.5) { seq = ns; improved = true; }
    }
    for (let i = 0; i < n; i++) {
      const rest = seq.filter((_, k) => k !== i);
      for (let p = 0; p <= rest.length; p++) { const ns = [...rest.slice(0, p), seq[i], ...rest.slice(p)]; if (seqCost(ns, M).dur < seqCost(seq, M).dur - 0.5) { seq = ns; improved = true; break; } }
    }
  }
  return seq;
}
// 元の順番から何か所の順番が変わったか（最長共通部分列で判定）
function changedCount(oldIds, newIds) {
  const a = oldIds, b = newIds.filter(id => a.includes(id));
  const L = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) L[i][j] = a[i - 1] === b[j - 1] ? L[i - 1][j - 1] + 1 : Math.max(L[i - 1][j], L[i][j - 1]);
  return a.length - L[a.length][b.length];
}

// 停留所をコースに入れる（新規追加・他コースからの移動・保留から戻す）ときの候補
async function planInsert(stop, rid) {
  const r = getRoute(rid);
  const base = r.stops.filter(s => s.id !== stop.id);
  const applyIds = ids => {
    const cur = getRoute(rid);
    if (!cur) return;
    const curBase = cur.stops.filter(s => s.id !== stop.id).map(s => s.id);
    if (curBase.length !== base.length || curBase.some(id => !ids.includes(id))) { toast('その間に内容が変わったため中止しました。もう一度操作してください'); return; }
    commit(() => {
      let obj = stop; const f = findStop(stop.id);
      if (f) { obj = f.stop; f.list.splice(f.idx, 1); if (f.listId !== rid) obj.orig = null; }
      const rr = getRoute(rid); const m = new Map(rr.stops.map(s => [s.id, s])); m.set(obj.id, obj);
      rr.stops = ids.map(id => m.get(id)).filter(Boolean);
    });
    toast(`「${stop.name}」を${r.name}に入れました（↶戻す で取り消し）`);
  };
  if (!base.length) { applyIds([stop.id]); return; }
  toast('ルートの候補を計算しています…');
  const nodes = [state.school, ...base, stop]; const n = nodes.length - 1;
  const M = await getMatrix(nodes);
  const baseSeq = base.map((_, i) => i + 1);
  const ins = [];
  for (let p = 0; p <= base.length; p++) { const seq = [...baseSeq.slice(0, p), n, ...baseSeq.slice(p)]; ins.push({ seq, p, dur: seqCost(seq, M).dur }); }
  ins.sort((a, b) => a.dur - b.dur);
  const posName = p => p === 0 ? '最初（園を出てすぐ）' : p === base.length ? `最後（「${base[p - 1].name}」の後、園に戻る前）` : `「${base[p - 1].name}」と「${base[p].name}」の間`;
  const cands = [{ label: '元のルートを保持', desc: `今の順番はそのままで、時間が一番増えない ${posName(ins[0].p)} に入れます。`, seq: ins[0].seq }];
  if (ins[1]) cands.push({ label: '元のルートを保持（別の位置）', desc: `今の順番はそのままで、${posName(ins[1].p)} に入れます。`, seq: ins[1].seq });
  cands.push({ label: '最短ルートに組み直す', desc: '全停留所の順番を並べ替えて、所要時間が一番短くなるようにします。', seq: solveTSP(n, M) });
  const baseCalc = legsFor(r);
  const baseMin = !r.stops.some(s => s.id === stop.id) && baseCalc.status === 'ok' ? timing(r, ui.pat).total : candMinutes(seqCost(baseSeq, M), base);
  openCandidates({ title: `「${stop.name}」を${r.name}に入れる`, note: `入れる前のこのコースの所要時間：${Math.round(baseMin)}分。候補をクリックすると地図に表示されます。`, route: r, nodes, M, cands, baseMin, newId: stop.id, oldIds: base.map(s => s.id), apply: applyIds });
}
// 今のコースの順番を見直す候補
async function optimize(rid) {
  const r = getRoute(rid); if (!r || r.stops.length < 2) { toast('停留所が2か所以上必要です'); return; }
  toast('ルートの候補を計算しています…');
  const nodes = [state.school, ...r.stops]; const n = r.stops.length;
  const M = await getMatrix(nodes);
  const cur = r.stops.map((_, i) => i + 1);
  // 1か所だけ動かして一番効果がある案
  let one = null;
  for (let i = 0; i < n; i++) {
    const rest = cur.filter((_, k) => k !== i);
    for (let p = 0; p <= rest.length; p++) { const seq = [...rest.slice(0, p), cur[i], ...rest.slice(p)]; const d = seqCost(seq, M).dur; if (!one || d < one.d) one = { seq, d, i, p, rest }; }
  }
  const opt = solveTSP(n, M);
  const rev = [...cur].reverse();

    if (!br) { R.meta.push('新しく作るコース'); items.push(`【コース新設】${cr.name}`); }
    if (!cr) { R.meta.push('このコースは無くなります'); items.push(`【コース廃止】${br.name}`); }
    if (br && cr) {
      if (br.name !== cr.name) R.meta.push(`コース名：${br.name} → ${cr.name}`);

          if (reordered.has(c)) { kind = kind || 'mod'; ch.push(`順番を変更（${b.num}→${c.num}番目）`); cnt.reordered++; items.push(`【順番変更】${c.s.name}（${cr.name} ${b.num}番目 → ${c.num}番目）`); }

  </div>`;
  h += `<div class="page rpt"><h1>バスルート 変更詳細</h1><div class="rmeta">比較：${esc(baseLabel)} → 「${esc(state.name)}」　時刻は「変更前→変更後（差）」。${thr}分未満の差は変更後の時刻のみ表示。</div>`;
  for (const R of D.routes) {
    h += `<div class="rblock"><h2 style="border-color:${R.color}">${esc(R.name)}${R.cr ? `<small>（${R.cr.trip}便 ${esc(R.cr.area)}）</small>` : ''}</h2>`;
    if (R.meta.length) h += `<ul class="meta">${R.meta.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;
    if (!R.changed && !R.rows.some(r => r.t.some(x => x.show)) && !(R.end || []).some(x => x.show)) { h += `<p class="nochg">変更なし（時刻の差も${thr}分未満）</p></div>`; continue; }
    if (R.cr) {
      h += `<table class="det"><tr><th>番号</th><th>停留所名</th><th>変更内容</th><th>登園</th><th>降園</th><th>午前保育 降園</th></tr>
        <tr class="sch"><td></td><td>幼稚園 出発</td><td>${R.startT.some(x => x.was != null && x.was !== x.now) ? '出発時刻を変更' : ''}</td>${R.startT.map(x => `<td class="t">${x.was != null && x.was !== x.now ? `<span class="was">${fmt(x.was)}</span>→<b>${fmt(x.now)}</b>` : fmt(x.now)}</td>`).join('')}</tr>
        ${R.rows.map(r => `<tr class="k-${r.kind || 'none'}"><td class="c">${r.num}</td><td>${esc(r.name)}</td><td>${r.ch.map(esc).join('<br>') || (r.t.some(x => x.show) ? '時刻のみ変更' : '')}</td>${r.t.map(x => `<td class="t">${tcell(x)}</td>`).join('')}</tr>`).join('')}
        <tr class="sch"><td></td><td>幼稚園 到着</td><td></td>${R.end.map(x => `<td class="t">${tcell(x)}</td>`).join('')}</tr></table>`;
    }
    if (R.gone.length) {
      h += `<table class="det gone"><tr><th colspan="2">このコースから外れる停留所</th><th>変更内容</th><th>登園</th><th>降園</th><th>午前保育 降園</th></tr>
        ${R.gone.map(g => `<tr class="k-${g.to ? 'mod' : 'del'}"><td class="c">${g.num}</td><td>${esc(g.name)}</td><td>${g.to ? '→ ' + esc(g.to) + 'へ移動' : '廃止'}</td>${g.was.map((w, i) => `<td class="t">${g.to ? `<span class="was">${fmt(w)}</span>→<b>${fmt(g.now[i])}</b>` : `<span class="was">${fmt(w)}</span>`}</td>`).join('')}</tr>`).join('')}</table>`;
    }
    h += `</div>`;
  }
  h += `<div class="legend"><span class="k-new">新設</span><span class="k-mod">移動・場所/名称/順番変更</span><span class="k-time">時刻のみ変更</span><span class="k-del">廃止</span></div></div>`;
  return h;
}
async function buildDiffPages(baseSrc, thr) {

// ルート線・停留所・名前ラベルがすべて地図の枠内に収まるよう、位置と縮尺を調整
function fitPrintMap(m, line, pts) {
  const b = L.latLngBounds(line); pts.forEach(p => b.extend([p.lat, p.lng]));
  m.fitBounds(b, { padding: [30, 30], animate: false });
  const M = 10;
  for (let i = 0; i < 16; i++) {
    const cr = m.getContainer().getBoundingClientRect();
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
    line.forEach(ll => { const p = m.latLngToContainerPoint(ll); add(p.x, p.y); });
    m.getContainer().querySelectorAll('.leaflet-tooltip,.leaflet-marker-icon').forEach(el => {
      const r = el.getBoundingClientRect(); add(r.left - cr.left, r.top - cr.top); add(r.right - cr.left, r.bottom - cr.top);
    });
    const w = x1 - x0, h = y1 - y0;
    const fits = x0 >= M && y0 >= M && x1 <= cr.width - M && y1 <= cr.height - M;
    if (fits) break;
    m.panBy([(x0 + x1) / 2 - cr.width / 2, (y0 + y1) / 2 - cr.height / 2], { animate: false });
    if (w > cr.width - 2 * M || h > cr.height - 2 * M) m.setZoom(m.getZoom() - 0.25, { animate: false });
  }
}

// 保存したファイル（.json）を、今のアプリで使える形に整える（元のバスルート計画で書き出したものも読める）
function normalizeImported(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.routes) || !s.school || !isFinite(+s.school.lat) || !isFinite(+s.school.lng)) throw new Error('bad file');
  const st = { ...blankState(), ...s };
  st.name = s.name || '読み込んだ案';
  // 園名が入っていない（または「幼稚園」だけの）ファイルは、明青幼稚園として読み込む
  const nm = (s.school.name || '').trim();
  st.school = { name: nm && nm !== '幼稚園' ? nm : '明青幼稚園', lat: +s.school.lat, lng: +s.school.lng };
  st.settings = { ...defaultSettings(), ...(s.settings || {}) };
  st.buses = Array.isArray(s.buses) ? s.buses.filter(b => b && b.id) : [];
  if (!st.buses.length) st.buses = [{ id: 'b' + uid(), name: 'バス1', capacity: 30, phone: '' }];
  st.pool = Array.isArray(s.pool) ? s.pool.filter(x => x && isFinite(+x.lat)) : [];
  st.routes = s.routes.filter(r => r && Array.isArray(r.stops)).map((r, i) => ({
    ...r,   // 元のファイルにある項目（降園・午前の現行時刻など）はそのまま残す
    id: r.id || 'r' + uid(), name: r.name || `コース${i + 1}`, area: r.area || '', trip: +r.trip || 1,
    color: r.color || ROUTE_COLORS[i % ROUTE_COLORS.length], visible: r.visible !== false,
    start: { am: '8:00', pm: '14:00', half: '11:00', ...(r.start || {}) }, origEnd: r.origEnd || null,
    busId: st.buses.some(b => b.id === r.busId) ? r.busId : st.buses[0].id,
    stops: r.stops.filter(x => x && isFinite(+x.lat) && isFinite(+x.lng)),
  }));
  return st;
}

    <div class="f"><span>所要時間の補正係数（倍）</span><div><input type="number" id="sF" step="0.05" min="0.5" max="3" value="${factor()}" style="width:90px"> <button id="sCal">現行ダイヤから推定</button></div></div>
    <p class="note" style="margin-top:-4px">道路データの所要時間（乗用車の目安）にこの倍率を掛けます。バスは乗用車より遅く、朝の渋滞もあるため1.2〜1.6倍程度が目安。「現行ダイヤから推定」は、現行時刻（今の時刻表の園着時刻）を入力したコースに合うように自動で決めます。</p>
    <div class="f"><span>1か所あたりの停車時間（分）</span><input type="number" id="sD" step="0.5" min="0" value="${st.dwell}" style="width:90px"></div>
    <div class="f"><span>便の間に必要な余裕（分）</span><input type="number" id="sB" step="1" min="0" value="${st.buffer}" style="width:90px"></div>
    <h3>バス</h3>
    <table><tr><th>名前</th><th>定員（園児）</th><th>電話番号</th><th>写真（印刷用）</th><th></th></tr>
    ${state.buses.map((b, i) => `<tr><td><input type="text" class="bN" data-i="${i}" value="${esc(b.name)}"></td><td><input type="number" class="bC" data-i="${i}" min="0" value="${b.capacity}" style="width:70px"></td><td><input type="text" class="bP" data-i="${i}" value="${esc(b.phone || '')}"></td>
      <td style="white-space:nowrap">${busPhoto(b.id) ? `<img class="bphoto" src="${busPhoto(b.id)}">` : '<small>なし</small>'} <button class="bImg" data-id="${b.id}" style="font-size:11px;padding:2px 6px">${busPhoto(b.id) ? '変更' : '追加'}</button>${busPhoto(b.id) ? ` <button class="bImgR" data-id="${b.id}" style="font-size:11px;padding:2px 6px">消す</button>` : ''}</td>
      <td>${used(b.id) || state.buses.length < 2 ? '' : `<button class="bDel" data-i="${i}" title="このバスを削除" style="font-size:11px;padding:2px 6px;color:var(--bad)">✕</button>`}</td></tr>`).join('')}</table>
    <div class="tools" style="margin-top:6px"><button id="bAdd">＋ バスを追加</button></div>
    <p class="note">※電話番号と写真は、印刷するルートマップに載ります。コースが使っているバスは削除できません。</p>
    <h3>その他</h3>
    <div class="f"><span>印刷タイトルの年度表記</span><input type="text" id="sY" value="${esc(st.yearLabel)}"></div>
    <div class="f"><span>経路データ</span><div><button id="sClr">経路を再取得（キャッシュ削除）</button></div></div>
    <h3>この端末のデータ</h3>
    <p class="note">このアプリのデータ（コース・停留所・保存した案・写真）は、この端末の中だけに保存されています。端末を手放すときや、使うのをやめるときは消してください。</p>
    <div class="tools"><button id="sErase" style="color:var(--bad)">この端末からバスルートのデータをすべて消す</button></div>`,
    [{ label: '保存', primary: true, fn: () => { applySettingsInputs(); render(); closeDialog(); toast('設定を保存しました'); } }]);
  function applySettingsInputs() {
    commit(() => {
      const s = state.settings; s.factor = Math.max(0.5, Math.min(3, parseFloat($('#sF').value) || 1.3));
      s.dwell = Math.max(0, parseFloat($('#sD').value) || 0); s.buffer = Math.max(0, parseFloat($('#sB').value) || 0);
      s.yearLabel = $('#sY').value; s.city = $('#sCity').value.trim();
      state.school.name = $('#sSN').value.trim() || '幼稚園';
      document.querySelectorAll('.bN').forEach(e => state.buses[e.dataset.i].name = e.value.trim() || 'バス');
      document.querySelectorAll('.bC').forEach(e => state.buses[e.dataset.i].capacity = Math.max(0, parseInt(e.value) || 0));
      document.querySelectorAll('.bP').forEach(e => state.buses[e.dataset.i].phone = e.value);
    });
    ui.moveSchool = $('#sMS').checked;
  }
  $('#bAdd').onclick = () => { applySettingsInputs(); commit(() => state.buses.push({ id: 'b' + uid(), name: `バス${state.buses.length + 1}`, capacity: 30, phone: '' })); settingsDialog(); };
  document.querySelectorAll('.bDel').forEach(b => b.onclick = () => {
    const bus = state.buses[+b.dataset.i]; if (!confirm(`「${bus.name}」を削除しますか？`)) return;
    applySettingsInputs(); commit(() => { state.buses = state.buses.filter(x => x.id !== bus.id); });
    delete photos[bus.id]; savePhotos(); settingsDialog();
  });
  document.querySelectorAll('.bImg').forEach(b => b.onclick = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => { const f = inp.files[0]; if (!f) return; const img = new Image(); img.onload = () => {
      const sc = Math.min(1, 480 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      // 描き直すことで、写真に含まれる撮影場所などの情報（EXIF）は取り除かれる
      photos[b.dataset.id] = c.toDataURL('image/jpeg', 0.82);
      savePhotos().then(() => toast('写真を保存しました')).catch(() => alert('写真を保存できませんでした'));
      URL.revokeObjectURL(img.src); applySettingsInputs(); settingsDialog();
    }; img.src = URL.createObjectURL(f); };
    inp.click();
  });
  document.querySelectorAll('.bImgR').forEach(b => b.onclick = () => { delete photos[b.dataset.id]; savePhotos(); applySettingsInputs(); settingsDialog(); toast('写真を消しました'); });
  $('#sCal').onclick = () => { const f = calibrate(); if (f) { $('#sF').value = f; toast(`推定値：${f}倍（「保存」で反映）`); } };
  $('#sClr').onclick = () => { routeCache = {}; localStorage.removeItem(LS_CACHE); for (const k in calc) delete calc[k]; render(); toast('経路を取得し直しています…'); };
  $('#sErase').onclick = async () => {
    if (!confirm('この端末に保存されている、バスルート計画のデータをすべて消します。\n（コース・停留所・保存した案・バスの写真）\n元に戻せません。よろしいですか？')) return;
    await eraseAllData(); location.reload();
  };
}

/* ============================================================
   初期設定（初めて開いたとき）
   ============================================================ */
const setup = { active: false, step: 1, name: '', lat: null, lng: null, city: '', results: [], buses: [], makeRoutes: true, yearLabel: '' };
let setupMarker = null;
function startSetup() {
  Object.assign(setup, { active: true, step: 1, name: '', lat: null, lng: null, city: '', results: [], buses: [{ name: 'バス1', capacity: 30, phone: '' }], makeRoutes: true, yearLabel: fiscalYearLabel() });
  ui.adding = false; ui.board = false; closeCandidates();
  layer.clearLayers(); applyBounds();
  render();
  // パネルを隠して地図の大きさが変わるので、地図に知らせてから日本全体を表示
  map.invalidateSize(); map.setView([36.3, 138.4], 5);
}
function placeSetupMarker(lat, lng, zoom) {
  setup.lat = lat; setup.lng = lng;
  if (!setupMarker) {
    setupMarker = L.marker([lat, lng], { draggable: true, icon: L.divIcon({ className: 'pin-wrap', html: '<div class="school-pin">園</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map);
    setupMarker.on('dragend', e => { const ll = e.target.getLatLng(); setup.lat = ll.lat; setup.lng = ll.lng; renderSetup(); });
  } else setupMarker.setLatLng([lat, lng]);
  if (zoom) map.setView([lat, lng], zoom);
  renderSetup();
}
function setupReadInputs() {
  if (setup.step === 1) { setup.name = $('#suName').value.trim(); setup.city = $('#suCity')?.value.trim() || setup.city; }
  if (setup.step === 2) setup.buses = [...document.querySelectorAll('.suBus')].map(tr => ({ name: tr.querySelector('.n').value.trim(), capacity: Math.max(0, parseInt(tr.querySelector('.c').value) || 0), phone: tr.querySelector('.p').value.trim() }));
  if (setup.step === 3) { setup.makeRoutes = $('#suRoutes').checked; setup.yearLabel = $('#suYear').value; }
}
async function setupSearch(q) {
  const box = $('#suRes'); box.hidden = false; box.innerHTML = '<div>検索中…</div>';
  const out = [];
  try {
    const j = await (await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q))).json();
    j.slice(0, 8).forEach(x => { const [lng, lat] = x.geometry.coordinates; out.push({ name: x.properties.title, lat, lng }); });
  } catch (e) { }
  try {
    const u = 'https://nominatim.openstreetmap.org/search?' + new URLSearchParams({ q, format: 'json', limit: 5, countrycodes: 'jp', 'accept-language': 'ja' });
    const j = await (await fetch(u)).json();
    j.forEach(x => out.push({ name: x.display_name.split(',').slice(0, 4).join(' '), lat: +x.lat, lng: +x.lon }));
  } catch (e) { }
  setup.results = out;
  if (!out.length) { box.innerHTML = '<div>見つかりませんでした。住所を短くするか、地図をタップして決めてください。</div>'; return; }
  box.innerHTML = out.map((r, i) => `<div data-i="${i}">${esc(r.name)}</div>`).join('');
  box.querySelectorAll('div[data-i]').forEach(d => d.onclick = () => {
    const r = setup.results[+d.dataset.i];
    // 住所から「〇〇市」などを取り出して、停留所検索の地域にする
    const m = r.name.match(/^(?:.+?[都道府県])?(.+?郡.+?[町村]|.+?市.+?区|.+?[市区町村])/);
    if (m && !setup.city) setup.city = m[1];
    setup.name = $('#suName').value.trim();
    placeSetupMarker(r.lat, r.lng, 16);
  });
}
function renderSetup() {
  document.body.classList.add('insetup');
  $('#schoolTitle').textContent = ''; $('#sampleBadge').hidden = true;
  const el = $('#setup'); el.hidden = false;
  const steps = `<div class="steps">${['① 園の場所', '② バス', '③ はじめる'].map((t, i) => `<span class="${i + 1 === setup.step ? 'on' : ''}">${t}</span>`).join('')}</div>`;

    el.innerHTML = `${steps}
      <div class="startfile">
        <b>📂 保存したデータがある場合</b>
        <p>以前に「書き出し」や「案の保存・読込」で保存したファイル（.json）を読み込むと、園の場所・バス・コースがそのまま入った状態で始められます。</p>
        <button class="primary" id="suFile" type="button">ファイルを読み込んで始める</button>

      <div class="or"><span>または、新しく登録する</span></div>

      <div class="fld">園の住所で探す<div class="row"><input type="text" id="suQ" placeholder="例：〇〇市〇〇町1-2-3"><button id="suGo">探す</button></div></div>
      <div class="res" id="suRes" hidden></div>
      <p>または、<b>地図をタップ</b>して園の位置に印を置いてください。印はドラッグで動かせます。</p>
      <div class="pos ${ok ? 'ok' : ''}">${ok ? '✓ 園の位置を決めました（印をドラッグすると微調整できます）' : '園の位置：まだ決まっていません'}</div>
      ${ok ? `<label class="fld">停留所を検索する地域（市区町村）<input type="text" id="suCity" value="${esc(setup.city)}" placeholder="例：〇〇市（空欄でも使えます）"></label>` : ''}
      <div class="privacy">🔒 このアプリのデータ（園の位置・コース・停留所・人数）は、<b>この端末の中だけ</b>に保存されます。<br>地図と道順の計算のために、<b>位置（緯度・経度）と検索した言葉だけ</b>をインターネットに送ります。園児の名前などは送りません。</div>
      <div class="foot"><button class="left" id="suSample">サンプルで試してみる</button><button class="primary" id="suNext" ${ok ? '' : 'disabled'}>次へ →</button></div>`;
    const q = $('#suQ');
    $('#suFile').onclick = () => $('#fileIn').click();
    $('#suGo').onclick = () => { if (q.value.trim()) setupSearch(q.value.trim()); };
    q.addEventListener('keydown', e => { if (e.key === 'Enter' && q.value.trim()) setupSearch(q.value.trim()); });
    $('#suName').addEventListener('input', e => { setup.name = e.target.value; });
    $('#suNext').onclick = () => {
      setupReadInputs();
      if (!setup.name) { toast('園の名前を入れてください'); $('#suName').focus(); return; }
      setup.step = 2; renderSetup();
    };
    $('#suSample').onclick = () => { if (setupMarker) { map.removeLayer(setupMarker); setupMarker = null; } finishSetup(sampleState()); toast('サンプルを開きました（場所・停留所・コースは架空です）。自由に動かして試してください', 6000); };
  } else if (setup.step === 2) {
    el.innerHTML = `${steps}<h2>バスを登録してください</h2>
      <p>台数・定員はあとから⚙設定で変えられます。電話番号は印刷するルートマップに載ります（空欄でもかまいません）。</p>
      <table><tr><th>名前</th><th style="width:80px">定員</th><th>電話（任意）</th><th></th></tr>
      ${setup.buses.map((b, i) => `<tr class="suBus"><td><input type="text" class="n" value="${esc(b.name)}" placeholder="例：大型バス（青）"></td><td><input type="number" class="c" min="0" value="${b.capacity}"></td><td><input type="text" class="p" value="${esc(b.phone)}"></td>
        <td>${setup.buses.length > 1 ? `<button class="suDel" data-i="${i}" title="削除">✕</button>` : ''}</td></tr>`).join('')}</table>
      <div><button id="suAdd">＋ バスを追加</button></div>
      <div class="foot"><button class="left" id="suBack">← 戻る</button><button class="primary" id="suNext">次へ →</button></div>`;
    $('#suAdd').onclick = () => { setupReadInputs(); setup.buses.push({ name: `バス${setup.buses.length + 1}`, capacity: 30, phone: '' }); renderSetup(); };
    el.querySelectorAll('.suDel').forEach(b => b.onclick = () => { setupReadInputs(); setup.buses.splice(+b.dataset.i, 1); renderSetup(); });
    $('#suBack').onclick = () => { setupReadInputs(); setup.step = 1; renderSetup(); };
    $('#suNext').onclick = () => {
      setupReadInputs();
      setup.buses.forEach((b, i) => { if (!b.name) b.name = `バス${i + 1}`; });
      setup.step = 3; renderSetup();
    };
  } else {
    el.innerHTML = `${steps}<h2>準備ができました</h2>
      <p><b>${esc(setup.name)}</b>・バス ${setup.buses.length}台（${setup.buses.map(b => esc(b.name)).join('、')}）</p>
      <label class="fld">印刷タイトルの年度表記<input type="text" id="suYear" value="${esc(setup.yearLabel)}"></label>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px"><input type="checkbox" id="suRoutes" ${setup.makeRoutes ? 'checked' : ''} style="margin-top:3px"> バスごとに、空のコースを1つずつ作っておく（あとで名前・時刻を変えて、地図に停留所を置いていきます）</label>
      <div class="foot"><button class="left" id="suBack">← 戻る</button><button class="primary" id="suGo">はじめる</button></div>`;
    $('#suBack').onclick = () => { setupReadInputs(); setup.step = 2; renderSetup(); };
    $('#suGo').onclick = () => {
      setupReadInputs();
      const st = blankState();
      st.school = { name: setup.name, lat: setup.lat, lng: setup.lng };
      st.settings.city = setup.city; st.settings.yearLabel = setup.yearLabel;
      st.buses = setup.buses.map(b => ({ id: 'b' + uid(), ...b }));
      if (setup.makeRoutes) st.routes = st.buses.map((b, i) => ({ id: 'r' + uid(), name: `${b.name}コース`, area: '', busId: b.id, trip: 1, color: ROUTE_COLORS[i % ROUTE_COLORS.length], visible: true, start: { am: '8:00', pm: '14:00', half: '11:00' }, origEnd: null, stops: [] }));
      if (setupMarker) { map.removeLayer(setupMarker); setupMarker = null; }
      finishSetup(st);
    };
  }
}
function finishSetup(st) {
  setup.active = false;
  document.body.classList.remove('insetup'); $('#setup').hidden = true;
  hist.past = []; hist.future = [];
  state = st; ui.sel = state.routes[0]?.id; ui.mode = 'all';
  save(); applyBounds(); render();
  setTimeout(() => { map.invalidateSize(); fitAll(); }, 50);
  if (!localStorage.getItem(LS_HELP)) { try { localStorage.setItem(LS_HELP, '1'); } catch (e) { } setTimeout(helpDialog, 600); }
}

/* ============================================================
   描画まとめ
   ============================================================ */
let pendingSide = false;
function render() {
  if (setup.active || !state.school) { if (!setup.active) { startSetup(); return; } renderSetup(); return; }
  ensureCalcs();
  $('#schoolTitle').textContent = state.school.name + ' ';
  $('#sampleBadge').hidden = !state.sample;
  $('#scnName').value = state.name;
  document.querySelectorAll('#patBox button').forEach(b => b.classList.toggle('on', b.dataset.pat === ui.pat));
  $('#btnUndo').disabled = !hist.past.length; $('#btnRedo').disabled = !hist.future.length;
  $('#btnAdd').classList.toggle('on', ui.adding);
  document.body.classList.toggle('adding', ui.adding);
  const r = getRoute(ui.sel);
  $('#addHint').hidden = !ui.adding;
  $('#addHint').textContent = `追加先：${r ? r.name : '—'}　地図を${TOUCH ? 'タップ' : 'クリック'}すると停留所を追加します（もう一度ボタンで終了）`;
  renderSide(); renderBoard(); renderMap();
  pendingSide = false;
}
// 入力中に経路計算が終わってもテキストが消えないように
function requestRender() {
  const a = document.activeElement;
  if (a && $('#side').contains(a) && a.matches('input,select')) { pendingSide = true; renderBoard(); renderMap(); return; }
  render();
}
$('#side').addEventListener('focusout', () => setTimeout(() => { if (pendingSide && !$('#side').contains(document.activeElement)) render(); }, 50));

let toastT;
function toast(msg, ms = 3000, action) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show'); t.classList.toggle('act', !!action);
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { t.classList.remove('show'); action.fn(); }; t.appendChild(b); }
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* イベント */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { ui.mode = b.dataset.mode; render(); });
document.querySelectorAll('#patBox button').forEach(b => b.onclick = () => { ui.pat = b.dataset.pat; render(); });
$('#btnSide').onclick = () => {
  const b = document.body; const portrait = matchMedia('(max-width:900px)').matches;
  if (b.classList.contains('side-hidden')) b.classList.remove('side-hidden');
  else if (portrait && !b.classList.contains('side-big')) b.classList.add('side-big');
  else { b.classList.remove('side-big'); b.classList.add('side-hidden'); }
  setTimeout(() => map.invalidateSize(), 50);
};
window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 100));
$('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
$('#btnAdd').onclick = toggleAdd;
$('#btnBoard').onclick = () => { ui.board = !ui.board; render(); };
$('#btnBoardClose').onclick = () => { ui.board = false; render(); };
$('#btnScn').onclick = scenarioDialog;
$('#btnExport').onclick = exportDialog;
$('#btnPrint').onclick = printDialog;
$('#btnSettings').onclick = settingsDialog;
$('#btnHelp').onclick = helpDialog;
$('#scnName').addEventListener('change', e => { state.name = e.target.value.trim() || '無題の案'; save(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) doSearch(e.target.value.trim()); if (e.key === 'Escape') $('#sres').hidden = true; });
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#sres').hidden = true; });
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || setup.active) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  if (e.key === 'Escape' && candState) { closeCandidates(); return; }
  if (e.key === 'Escape' && ui.adding) { ui.adding = false; render(); }
});

$('#btnBox').href = BOX.homeUrl;

/* 起動 */
render();
if (state.school) setTimeout(() => { map.invalidateSize(); fitAll(); }, 150);
// 許可証がなければ「どうぐばこを開いてください」を画面の上に出す（共通部品がないとき＝単体で使うときは確認しない）
document.addEventListener('DOMContentLoaded', () => { if (window.DouguLicense) window.DouguLicense.guardApp(BOX.appId, BOX.homeUrl); });
// オフライン対応：どうぐばこ共通の仕組み（sw.js）に登録。地図と道順の計算はネットが必要
if (/^https?:$/.test(location.protocol)) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
</script>
</body>
</html>
