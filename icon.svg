<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb39a"/>
      <stop offset="1" stop-color="#2f7d6b"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ec7a1f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="180" height="180" fill="url(#bg)"/>
  <circle cx="40" cy="34" r="46" fill="#ffffff" opacity=".08"/>
  <!-- きらきら -->
  <path d="M150 14 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#fff6c9"/>
  <path d="M30 20 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#fff6c9" opacity=".85"/>

  <!-- 影 -->
  <ellipse cx="90" cy="153" rx="62" ry="7" fill="#000" opacity=".16"/>

  <!-- ふた（後ろに開いている） -->
  <path d="M38 96 L142 96 L158 52 L22 52 Z" fill="#c9611a" stroke="#c9611a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M50 92 L130 92 L142 60 L38 60 Z" fill="#a9481a" opacity=".6"/>
  <!-- ふたのふち（開いた側） -->
  <rect x="18" y="45" width="144" height="11" rx="5.5" fill="#ff9a3c"/>
  <rect x="26" y="47.5" width="46" height="3.5" rx="1.75" fill="#ffffff" opacity=".35"/>

  <!-- 中の道具 -->
  <!-- 定規 -->
  <g transform="rotate(-14 66 72)">
    <rect x="58" y="38" width="16" height="64" rx="2" fill="#fff4c2"/>
    <g stroke="#d8b25a" stroke-width="2" stroke-linecap="round">
      <line x1="58" y1="46" x2="65" y2="46"/><line x1="58" y1="53" x2="62" y2="53"/>
      <line x1="58" y1="60" x2="65" y2="60"/><line x1="58" y1="67" x2="62" y2="67"/>
      <line x1="58" y1="74" x2="65" y2="74"/><line x1="58" y1="81" x2="62" y2="81"/>
    </g>
  </g>
  <!-- 賞状（くるくる） -->
  <g transform="rotate(6 90 70)">
    <rect x="80" y="44" width="22" height="56" rx="4" fill="#ffffff"/>
    <rect x="80" y="44" width="22" height="7" rx="3.5" fill="#e9eef0"/>
    <rect x="86" y="62" width="10" height="12" rx="2" fill="#e8434f"/>
    <path d="M86 73 l0 9 5 -4 5 4 0 -9z" fill="#c92f3b"/>
  </g>
  <!-- えんぴつ -->
  <g transform="rotate(18 118 70)">
    <rect x="111" y="44" width="13" height="50" fill="#ffd23f"/>
    <rect x="115.5" y="44" width="4" height="50" fill="#f5b81f"/>
    <rect x="111" y="40" width="13" height="7" fill="#c7cdd1"/>
    <rect x="111" y="33" width="13" height="8" rx="3" fill="#ff8fa3"/>
    <path d="M111 94 L124 94 L117.5 110 Z" fill="#f6d9a8"/>
    <path d="M115 104 L120 104 L117.5 110 Z" fill="#3a3a3a"/>
  </g>
  <!-- クレヨン -->
  <g transform="rotate(-30 44 86)">
    <rect x="38" y="66" width="11" height="34" rx="2" fill="#4a90d9"/>
    <rect x="38" y="76" width="11" height="12" fill="#ffffff" opacity=".85"/>
    <path d="M38 66 L43.5 56 L49 66 Z" fill="#3a78bf"/>
  </g>

  <!-- 箱の本体 -->
  <rect x="30" y="88" width="120" height="13" rx="6" fill="#ffab55"/>
  <rect x="34" y="96" width="112" height="54" rx="10" fill="url(#body)"/>
  <rect x="34" y="136" width="112" height="14" rx="7" fill="#d96a16" opacity=".55"/>
  <rect x="44" y="104" width="40" height="5" rx="2.5" fill="#ffffff" opacity=".28"/>
  <!-- 留め金 -->
  <rect x="80" y="108" width="20" height="16" rx="4" fill="#ffd23f"/>
  <rect x="86" y="113" width="8" height="6" rx="2" fill="#e0a81a"/>
</svg>
