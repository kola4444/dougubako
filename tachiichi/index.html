<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 安全のための決まり：このアプリは名簿などをどこにも送れない（通信先は自分のサイトだけ） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="立ち位置">
<meta name="theme-color" content="#2b2140">
<title>お遊戯会 立ち位置</title>
<!-- 先生に配る「配布版」。どうぐばこの開発の影響を受けないよう、部品・オフライン対応はこのフォルダの中だけで完結させている -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<!-- 名簿の読み込み（SheetJS）と PDF 作成（jsPDF）は、どうぐばこのサイトに置いたものを使う -->
<script src="lib/sheetjs/xlsx.full.min.js"></script>
<script src="lib/jspdf/jspdf.umd.min.js"></script>
<script src="lib/sortable/Sortable.min.js"></script>
<style>
:root{
  --bg:#f5f3fa; --panel:#fff; --ink:#22202a; --muted:#6b6878; --line:#e3dfee; --accent:#5f3dc4; --accent-soft:#efeafd;
  --bad:#c92a2a; --badbg:#fff0f0; --warn:#d9480f; --warnbg:#fff4e6; --hdr:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;min-height:40px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button:disabled{opacity:.45;cursor:default}
input[type=text],select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:16px;min-height:42px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));background:#2b2140;color:#fff}
header h1{font-size:17px;margin:0 auto 0 0;white-space:nowrap}
header button{background:#3d3159;border-color:#55487a;color:#fff}
header button.primary{background:#fff;color:#2b2140;border-color:#fff}
.boxlink{color:#fff;text-decoration:none;background:#2f7d6b;border-radius:8px;padding:8px 12px;font-weight:700;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:14px max(14px,env(safe-area-inset-right)) 30px max(14px,env(safe-area-inset-left));align-items:start}
@media (max-width:1050px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.fld input,.fld select{width:100%}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.6}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{min-width:48px;text-align:center;font-size:22px}
.stepper button{width:48px;font-size:22px;padding:0}
details.scnames summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:10px}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:8px}
.scgrid label{display:flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
.scgrid input{flex:1;min-width:0;min-height:36px;font-size:15px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}

/* 場面のタブ */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;border-radius:999px;padding:4px 14px;min-height:40px;line-height:1.2}
.tabs button small{display:block;font-size:11px;color:var(--muted)}
.tabs button.on{background:#2b2140;border-color:#2b2140;color:#fff}
.tabs button.on small{color:#cfc6e8}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tools button{font-size:13px;min-height:36px;padding:4px 10px}

/* 並ぶ場所：選ぶボタン（人数つき） */
.posbar{display:flex;gap:6px;flex-wrap:wrap}
.posbar button{border:2px solid var(--c);color:var(--c);background:#fff;border-radius:10px;min-height:44px;padding:4px 12px;font-weight:700;line-height:1.2;text-align:left}
.posbar button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.posbar button.on{background:var(--c);color:#fff}
.posbar button.on small{color:rgba(255,255,255,.85)}
/* 選んでいる場所の中身 */
.panel{border:2px solid var(--c);border-radius:12px;margin-top:10px;overflow:hidden}
.panel .ph{background:var(--c);color:#fff;padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel .ph small{font-weight:400;font-size:12px;opacity:.95}
.panel ol{list-style:none;margin:0;padding:8px;display:grid;gap:6px;min-height:56px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 6px;background:#fff;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.panel li .grip{color:#9b95ad;font-size:20px;line-height:1;padding:0 4px;cursor:grab}
.panel li .no{color:var(--muted);font-size:12px;min-width:22px;text-align:right}
.panel li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel li button{flex:none;min-height:36px;min-width:36px;padding:0;border:0;background:#f3f1f8;border-radius:8px}
.panel .emptyl{color:var(--muted);font-size:13px;padding:10px;text-align:center}
.panel .howto{font-size:12px;color:var(--muted);padding:0 12px 8px}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 6px 16px rgba(0,0,0,.18);border-color:var(--c)!important}

/* 名簿から選ぶ */
.picker{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.picker .ptitle{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.picker .ptitle b{color:var(--active)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin-top:8px}
.names button{text-align:left;padding:5px 8px;min-height:44px;line-height:1.25;position:relative}
.names button .tag{display:block;font-size:11px;color:#fff;background:var(--c);border-radius:4px;padding:0 5px;width:max-content;margin-top:2px}
.names button.placed{background:#faf9fd}
.names button.here{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.gapbox{border:1px dashed #7048e8;border-radius:10px;padding:8px 10px;margin:4px 0 10px;background:#faf8ff}
.gapbox label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.gapbox input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px}
.gapbox textarea{width:100%;margin-top:8px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:64px;resize:vertical;background:#fff}
.gapbox .gnote{font-size:12px;color:var(--muted);margin-top:4px}
/* フィナーレ */
.tabs button.fin{border-color:#e8590c;color:#e8590c;font-weight:700}
.tabs button.fin.on{background:#e8590c;border-color:#e8590c;color:#fff}
.tabs button.fin small{color:inherit;opacity:.8}
.finhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:6px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:40px;padding:4px 18px;background:#fff}
.seg button.on{background:#2b2140;color:#fff;font-weight:700}
.rowstep{display:flex;align-items:center;gap:6px;font-size:14px}
.rowstep button{width:40px;min-height:38px;padding:0;font-size:18px}
.rowstep b{min-width:28px;text-align:center;font-size:18px}
.costs{display:flex;gap:6px;flex-wrap:wrap}
.costs button{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 18%,#fff);border-radius:10px;min-height:44px;padding:4px 12px;text-align:left;line-height:1.2}
.costs button.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent);font-weight:700}
.costs button small{display:block;font-size:11px;color:var(--muted)}
.costedit{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;display:grid;gap:8px}
.costedit .row input{flex:1;min-width:0}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;min-height:0;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 3px #2b2140}
.names button.dress{background:color-mix(in srgb,var(--dc) 22%,#fff);border-color:var(--dc)}
.names button .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--dc);margin-right:4px;vertical-align:0}
.left{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px}
.left.ok{background:#ebfbee;color:#2b8a3e}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px}

/* プレビュー */
.pv{position:sticky;top:calc(var(--hdr) + 14px)}
@media (max-width:1050px){.pv{position:static}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pager b{font-size:16px}
.canvasbox{background:#d9d5e3;border-radius:10px;padding:10px;display:grid;place-items:center}
.canvasbox canvas{width:100%;height:auto;max-width:620px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:2px}

/* ダイアログ・お知らせ */
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px 18px 16px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:17px}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg .list{display:grid;gap:8px}
.dlg .list button{text-align:left;padding:10px 12px}
.dlg .list small{display:block;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#22202a;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>🎭 お遊戯会 立ち位置</h1>
  <button id="btnMore" type="button">⋯ データ</button>
  <button id="btnPdf" class="primary" type="button">PDFを作成</button>
</header>

<main>
  <div>
    <section class="card">
      <h2><span class="n">1</span>クラスの名簿を読み込む</h2>
      <div class="row">
        <button class="primary" id="btnFile" type="button">📂 名簿ファイルを選ぶ</button>
        <span class="hint" id="fileInfo" style="margin:0">Numbers・Excel・CSV に対応</span>
      </div>
      <input type="file" id="fileIn" hidden accept=".numbers,.xlsx,.xls,.xlsm,.csv,.ods,application/vnd.apple.numbers,application/x-iwork-numbers-sffnumbers,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">
      <div id="classBox" hidden>
        <div class="fld"><span>クラスを選ぶ</span><select id="classSel"></select></div>
        <div class="hint" id="classPreview"></div>
      </div>
      <div id="loadErr"></div>
      <p class="hint">名簿は、この端末の中だけで使われます。インターネットには送られません。</p>
    </section>

    <section class="card">
      <h2><span class="n">2</span>お遊戯会の情報</h2>
      <div class="fld"><span>クラス名</span><input type="text" id="className" placeholder="例：ひまわり組"></div>
      <div class="fld"><span>タイトル（任意）</span><input type="text" id="title" placeholder="例：大きなかぶ"></div>
      <div class="fld"><span>場面の数</span>
        <div class="stepper"><button type="button" id="scMinus" aria-label="場面を減らす">−</button><b id="scCount">5</b><button type="button" id="scPlus" aria-label="場面を増やす">＋</button></div></div>
      <details class="scnames"><summary>場面ごとの名前をつける（任意）</summary><div class="scgrid" id="scNames"></div></details>
    </section>

    <section class="card">
      <h2><span class="n">3</span>場面ごとに、並ぶ場所へ子を入れる</h2>
      <div id="editor"><div class="empty">先に、1 でクラスの名簿を読み込んでください。</div></div>
    </section>
  </div>

  <div class="pv">
    <section class="card">
      <h2>できあがりの見本（PDFと同じ）</h2>
      <div class="pager"><button type="button" id="pvPrev">◀ 前の場面</button><b id="pvLabel">—</b><button type="button" id="pvNext">次の場面 ▶</button></div>
      <div class="canvasbox"><canvas id="pv" width="840" height="1188"></canvas></div>
    </section>
  </div>
</main>

<dialog id="dlg"></dialog>
<input type="file" id="jsonIn" hidden accept=".json,application/json,text/plain">
<div id="toast" role="status"></div>

<script>
'use strict';
/* ============================================================
   基本設定・保存（データはこの端末の中だけ）
   ============================================================ */
const NS = 'tachiichi.';   // 配布版は、どうぐばこの開発版とは別の保存場所を使う
const LS_CUR = NS + 'current.v2';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'c' + Math.random().toString(36).slice(2, 10);
const MAX_SCENES = 30;
// 並ぶ場所：ステージ・音響待機1・待機2…（待機の数＝場面の数−1）。色は画面とPDFで同じ
const LINE_COLORS = ['#1971c2', '#2f9e44', '#0c8599', '#c2255c', '#5c940d', '#ae3ec9', '#e67700', '#3b5bdb', '#087f5b', '#d6336c'];
function positions(N = state.sceneCount) {
  const out = [{ key: 'stage', label: 'ステージ', color: '#7048e8', note: '今の場面で舞台に立つ子' }];
  if (N >= 2) out.push({ key: 'w1', label: '音響待機1', color: '#e8590c', note: '階段を上がった先の列。下が先頭' });
  for (let i = 2; i <= N - 1; i++) out.push({ key: 'w' + i, label: '待機' + i, color: LINE_COLORS[(i - 2) % LINE_COLORS.length], note: '後ろの待機列。上が先頭' });
  return out;
}
const posInfo = key => positions(MAX_SCENES).find(p => p.key === key);
function blank() { return { version: 2, className: '', title: '', sceneCount: 5, sceneNames: [], roster: [], scenes: {}, gaps: {}, cur: 1 }; }
let state;
try { state = JSON.parse(localStorage.getItem(LS_CUR)) || blank(); } catch (e) { state = blank(); }
state = { ...blank(), ...state };
let active = 'stage';        // 今、名前を入れる場所
let onlyLeft = false;        // まだ入っていない子だけ表示
let lastBook = null;         // 読み込んだ名簿（クラスの候補）
function save() { try { localStorage.setItem(LS_CUR, JSON.stringify(state)); } catch (e) { } }

let toastT;
function toast(msg, ms = 2800) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }

/* ---------- 場面ごとの並び ---------- */
function scene(k) {
  const s = state.scenes[k] || (state.scenes[k] = {});
  for (const p of positions()) if (!Array.isArray(s[p.key])) s[p.key] = [];
  return s;
}
// 今の場面の数で使う場所だけを見る（場面を減らして使わなくなった待機列は数えない）
function posOf(k, id) { const s = scene(k); for (const p of positions()) if (s[p.key].includes(id)) return p.key; return null; }
// その場面で、子を場所に入れる（別の場所にいれば移す。同じ場所にいれば外す）
function assign(k, id, key) {
  const s = scene(k); const was = posOf(k, id);
  for (const key of Object.keys(s)) s[key] = s[key].filter(x => x !== id);
  if (was !== key) s[key].push(id);
  save();
}
// ステージから一度捌ける子の「行き来スペース」（場面ごと。音響待機1の先頭の前に入る）
// フィナーレ：場面の最後に、全員がステージに並ぶ（待機列なし・横向きのページ）
const FIN_MAX_ROWS = 8;
const COSTUME_COLORS = ['#f06595', '#4dabf7', '#51cf66', '#ff922b', '#9775fa', '#fcc419', '#20c997', '#e03131', '#a0785a', '#868e96', '#3bc9db', '#d6336c'];
function finale() {
  const f = state.finale || (state.finale = {});
  if (!Number.isInteger(f.rows) || f.rows < 1) f.rows = 3;
  if (!Array.isArray(f.lines)) f.lines = [];
  while (f.lines.length < f.rows) f.lines.push([]);
  if (!Array.isArray(f.costumes)) f.costumes = [];
  if (!f.dress || typeof f.dress !== 'object') f.dress = {};
  return f;
}
const finRowOf = id => finale().lines.slice(0, finale().rows).findIndex(l => l.includes(id));
const finPlaced = () => finale().lines.slice(0, finale().rows).reduce((a, l) => a + l.filter(id => nameOf(id)).length, 0);
const costumeOf = id => { const f = finale(); return f.costumes.find(c => c.id === f.dress[id]) || null; };
const costumeNo = c => finale().costumes.indexOf(c) + 1;
const circled = n => n >= 1 && n <= 20 ? String.fromCharCode(0x2460 + n - 1) : `(${n})`;
// 名前：名（下の名前）だけを出す。同じ名の子がいるときは、上に小さく姓を出す
function shortName(id) {
  const full = nameOf(id).trim(); const parts = full.split(/[\s　]+/);
  const given = parts.length > 1 ? parts.slice(1).join(' ') : full, sur = parts.length > 1 ? parts[0] : '';
  const dup = state.roster.filter(r => { const q = r.name.trim().split(/[\s　]+/); return (q.length > 1 ? q.slice(1).join(' ') : r.name.trim()) === given; }).length > 1;
  return { given, sur: dup ? sur : '' };
}
function gapOf(k) { if (!state.gaps) state.gaps = {}; return state.gaps[k] || (state.gaps[k] = { on: false, text: '' }); }
const nameOf = id => (state.roster.find(r => r.id === id) || {}).name || '';
const placedCount = k => { const s = scene(k); return positions().reduce((a, p) => a + s[p.key].filter(id => nameOf(id)).length, 0); };
const sceneLabel = j => `場面${j}` + (state.sceneNames[j - 1] ? `「${state.sceneNames[j - 1]}」` : '');

/* ============================================================
   名簿の読み込み（Numbers / Excel / CSV）
   ・Numbers の表の名前（例：ひまわり組）を、クラス名として表示する
   ・1つのファイルに複数のクラスが入っていても選べる
     - 表やシート（タブ）ごとにクラスが分かれている
     - 「クラス」「組」の列でクラスが分かれている
     - 列の見出しがクラス名（例：ひまわり組｜さくら組）
   ============================================================ */
const NAME_RE = /氏名|名前|なまえ|園児名|児童名|生徒名|^name/i;
const KANA_RE = /ふりがな|フリガナ|よみ|かな|カナ/;
const CLASS_COL_RE = /^(クラス|クラス名|組|組名|学級|class)$/i;
const CLASS_NAME_RE = /組|ぐみ|クラス|class/i;
const DEFAULT_TABLE_RE = /^(表|テーブル|table)\s*\d+([-‐－]\d+)?$/i;
const isNum = v => typeof v === 'number' || /^\s*[0-9０-９]+(\.[0-9]+)?\s*(位|番)?\s*$/.test(String(v));
const clean = v => String(v ?? '').replace(/\s+/g, ' ').trim();

function readClasses(wb, fileBase) {
  const out = [];
  wb.SheetNames.forEach(sn => {
    const ws = wb.Sheets[sn];
    const base = sn.replace(/_\d+$/, '');
    const tname = clean(ws['!tableName']);
    // 表の名前が付いていれば、それをクラス名にする（「表1」のような初めからの名前は使わない）
    const label0 = tname && !DEFAULT_TABLE_RE.test(tname) ? tname : base;
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false, raw: true });
    const h = rows.findIndex(r => r.some(v => clean(v)));
    if (h < 0) return;
    const head = rows[h].map(clean);
    const body = rows.slice(h + 1);
    const width = Math.max(...rows.map(r => r.length));
    const colVals = c => body.map(r => clean(r[c]));
    const textCol = c => { const v = colVals(c).filter(Boolean); return v.length && v.filter(isNum).length / v.length < 0.5; };
    let ni = head.findIndex((x, c) => NAME_RE.test(x) && !KANA_RE.test(x) && textCol(c));
    if (ni < 0) ni = head.findIndex((x, c) => KANA_RE.test(x) && textCol(c));
    const ci = head.findIndex((x, c) => CLASS_COL_RE.test(x) && c !== ni);
    if (ni >= 0 && ci >= 0) {
      const groups = new Map();
      body.forEach(r => { const n = clean(r[ni]); if (!n) return; const k = clean(r[ci]) || '（クラスなし）'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(n); });
      groups.forEach((names, k) => out.push({ label: k, names }));
      return;
    }
    const classCols = [];
    for (let c = 0; c < width; c++) if (CLASS_NAME_RE.test(head[c]) && !NAME_RE.test(head[c]) && !KANA_RE.test(head[c]) && textCol(c)) classCols.push(c);
    if (classCols.length) { classCols.forEach(c => out.push({ label: head[c], names: colVals(c).filter(Boolean) })); return; }
    if (ni < 0) for (let c = 0; c < width; c++) if (textCol(c)) { ni = c; break; }
    if (ni < 0) return;
    const names = colVals(ni).filter(Boolean);
    if (names.length) out.push({ label: label0, names });

  out.forEach(o => { seen[o.label] = (seen[o.label] || 0) + 1; if (seen[o.label] > 1) o.label += `（${seen[o.label]}）`; });

}

const sameNames = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
function drawPage(cv, k) {
  const W = cv.width, mm = W / 210;
  const ctx = cv.getContext('2d');
  ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, cv.height);
  const N = state.sceneCount, s = scene(k), P = positions();
  const list = key => (s[key] || []).filter(id => nameOf(id));
  const f = (px, w = 400) => `${w} ${px}px ${FONT}`;
  const text = (str, x, y, size, opt = {}) => {
    ctx.font = f(size * mm, opt.w || 400); ctx.fillStyle = opt.c || '#111'; ctx.textAlign = opt.a || 'left';
    if (opt.max) { let sz = size; while (ctx.measureText(str).width > opt.max * mm && sz > 1.8) { sz -= 0.2; ctx.font = f(sz * mm, opt.w || 400); } }
    ctx.fillText(str, x * mm, y * mm);
    return ctx.measureText(str).width / mm;
  };
  const rect = (x, y, w, h, fill, stroke, lw, r = 0) => {
    ctx.beginPath(); if (r && ctx.roundRect) ctx.roundRect(x * mm, y * mm, w * mm, h * mm, r * mm); else ctx.rect(x * mm, y * mm, w * mm, h * mm);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = (lw || 0.3) * mm; ctx.stroke(); }
  };
  const arrow = (x1, y1, x2, y2, lw, head) => {
    ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; ctx.lineWidth = lw * mm; ctx.lineCap = 'butt';
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x1 * mm, y1 * mm); ctx.lineTo((x2 - Math.cos(a) * head * 0.8) * mm, (y2 - Math.sin(a) * head * 0.8) * mm); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2 * mm, y2 * mm);
    ctx.lineTo((x2 - Math.cos(a - 0.45) * head) * mm, (y2 - Math.sin(a - 0.45) * head) * mm);
    ctx.lineTo((x2 - Math.cos(a + 0.45) * head) * mm, (y2 - Math.sin(a + 0.45) * head) * mm); ctx.closePath(); ctx.fill();
  };

  // ---- 上の見出し：クラス名・タイトル・場面 ----
  const L = 12, R = 198;
  let x = text(state.className || 'クラス名', L, 17, 7.5, { w: 700, max: 80 });
  if (state.title) text(state.title, L + x + 5, 17, 6, { c: '#333', max: R - L - x - 8 });
  rect(L, 22, 30, 11.5, '#111', null, 0, 2.5);
  text(`場面 ${k}`, L + 15, 30.3, 6.6, { w: 700, c: '#fff', a: 'center' });
  x = text(`／ 全${N}場面`, L + 33, 30.3, 4.6, { c: '#333' });
  if (state.sceneNames[k - 1]) text(`「${state.sceneNames[k - 1]}」`, L + 33 + x + 2, 30.5, 6, { w: 700, max: 55 });
  text(P.map(p => `${p.label} ${list(p.key).length}人`).join('　'), R, 30.3, 3, { a: 'right', c: '#555', max: 100 });

  // ---- ステージ全体の枠・中央の壁・階段 ----
  const X0 = 12, Y0 = 38, BW = 186, BH = 246;
  ctx.strokeStyle = '#111'; ctx.lineWidth = 0.9 * mm; ctx.strokeRect(X0 * mm, Y0 * mm, BW * mm, BH * mm);
  const WALL = X0 + BW * 0.46;
  const C1 = { x: X0 + BW * 0.475, w: BW * 0.19 }, ST = { x: X0 + BW * 0.68, w: BW * 0.305 };
  ctx.lineWidth = 0.7 * mm; ctx.beginPath(); ctx.moveTo(WALL * mm, (Y0 + 16) * mm); ctx.lineTo(WALL * mm, (Y0 + BH) * mm); ctx.stroke();
  text('壁', WALL - 1.6, Y0 + BH - 3, 2.8, { c: '#666', a: 'right' });
  text('階段', WALL - 10, Y0 + 7, 4.2, { w: 700, a: 'center' });
  arrow(X0 + BW * 0.24, Y0 + 11, C1.x + C1.w * 0.75, Y0 + 11, 2.2, 5);
  const stTop = Y0 + 16, stBot = Y0 + BH - 4;
  rect(ST.x, stTop, ST.w, stBot - stTop, '#fbfaff', '#111', 0.5);

  // ---- 後ろの待機列（待機2・待機3…）：元の図と同じく2列。壁のすぐ後ろの列に前半、その後ろの列に後半 ----
  //      それぞれの列の中では、待機の番号の順に上から並ぶ（上が先頭）
  const back = P.filter(p => /^w\d+$/.test(p.key) && p.key !== 'w1');

  const areaL = X0 + 1.5, areaR = WALL - 2, areaT = Y0 + 16, areaB = Y0 + BH - 3;
  const colW = (areaR - areaL) / 2;
  const backCols = [
    { x: areaL + colW + 0.6, w: colW - 1.2, groups: back.slice(0, half) },   // 壁のすぐ後ろ
    { x: areaL + 0.6, w: colW - 1.2, groups: back.slice(half) },             // その後ろ
  ].filter(c => c.groups.length);

  // ---- 文字の大きさ：7文字の名前がちょうど入る大きさを上限にする（それより長い名前は、その子だけ小さくする） ----
  const fitChars = (w, n = 7) => { ctx.font = f(10 * mm, 500); return 10 * (w * mm) / ctx.measureText('あ'.repeat(n)).width; };
  const NAME_PAD = 6;   // 線・番号の分
  const colLines = c => c.groups.reduce((a, g) => a + list(g.key).length + 2, 0);
  const backLh = backCols.length ? Math.min(...backCols.map(c => (areaB - areaT - 10) / Math.max(1, colLines(c)))) : 9;
  const q1Top = Y0 + 30, q1Bot = Y0 + BH - 10;
  // 行き来スペース：文字は待機の子の名前と同じ大きさ。長い文は枠の中で折り返す
  const gap = gapOf(k);
  const wrapText = (str, width, size) => {
    ctx.font = f(size * mm, 500); const out = [];

  };

    gapH = gap.on ? Math.max(2, gapLines.length) * size * 1.4 + 4 : 0;
    w1Bot = q1Bot - gapH;   // 音響待機1の子は、スペースの分だけ上にずれる
    const w1Lh = (w1Bot - q1Top) / Math.max(1, list('w1').length);
    lh = Math.max(2.6, Math.min(8.2, backLh, w1Lh));

  const head = (p, x, y, w) => {
    rect(x, y - 5.2, w, 7.2, p.color, null, 0, 1.4);
    text(`${p.label}（${list(p.key).length}人）`, x + 1.4, y, 3.9, { w: 700, c: '#fff', max: w - 2.5 });
  };
  const nameAt = (p, i, x, w, y) => {
    rect(x, y - lh * 0.8, 1.1, lh * 0.95, p.color, null, 0, 0.4);
    text(String(i + 1), x + 2, y, Math.min(fs * 0.6, 3), { c: '#888' });
    text(nameOf(list(p.key)[i]), x + 5.6, y, fs, { w: 500, max: w - NAME_PAD });   // 長い名前は、この子だけ縮める（改行しない）
  };
  // 後ろの待機列（上が先頭）
  for (const c of backCols) {
    text('先頭 ↑', c.x + c.w - 0.3, areaT + 4, 2.8, { a: 'right', c: '#555' });
    let y = areaT + 11;
    for (const g of c.groups) {
      head(g, c.x, y, c.w); y += 3.2;
      list(g.key).forEach((id, i) => { y += lh; nameAt(g, i, c.x, c.w, y - lh * 0.25); });

      ctx.restore();
      if (gapLines.length) gapLines.forEach((l, i) => text(l, C1.x + 1.5, gy + 2 + fsC * (1.1 + i * 1.4), fsC, { w: 500, c: '#2b2140', max: C1.w - 3 }));

/* ---------- フィナーレのページ（A4横・ステージだけ） ---------- */
function drawFinale(cv) {
  const W = cv.width, mm = W / 297, ctx = cv.getContext('2d');
  ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, cv.height);
  const f = finale();
  const ff = (px, w = 400) => `${w} ${px}px ${FONT}`;
  const text = (str, x, y, size, opt = {}) => {
    ctx.font = ff(size * mm, opt.w || 400); ctx.fillStyle = opt.c || '#111'; ctx.textAlign = opt.a || 'left';
    if (opt.max) { let sz = size; while (ctx.measureText(str).width > opt.max * mm && sz > 1.8) { sz -= 0.2; ctx.font = ff(sz * mm, opt.w || 400); } }
    ctx.fillText(str, x * mm, y * mm); return ctx.measureText(str).width / mm;
  };
  const rect = (x, y, w, h, fill, stroke, lw, r = 0) => {
    ctx.beginPath(); if (r && ctx.roundRect) ctx.roundRect(x * mm, y * mm, w * mm, h * mm, r * mm); else ctx.rect(x * mm, y * mm, w * mm, h * mm);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = (lw || 0.3) * mm; ctx.stroke(); }
  };
  const tint = (hex, a) => { const h = hex.replace('#', ''); const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16); const m = v => Math.round(v * a + 255 * (1 - a)); return `rgb(${m(r)},${m(g)},${m(b)})`; };
  const rows = f.lines.slice(0, f.rows).map(l => l.filter(id => nameOf(id)));
  const total = rows.reduce((a, l) => a + l.length, 0);
  // 見出し
  const L = 12, R = 285;
  const x = text(state.className || 'クラス名', L, 15, 7, { w: 700, max: 90 });
  if (state.title) text(state.title, L + x + 5, 15, 5.5, { c: '#333', max: 120 });
  rect(L, 19.5, 40, 11, '#111', null, 0, 2.5);
  text('フィナーレ', L + 20, 27.4, 6.2, { w: 700, c: '#fff', a: 'center' });
  text(`ステージ ${total}人（クラス ${state.roster.length}人）`, R, 27.4, 3.4, { a: 'right', c: '#555' });
  // 衣装の見本（下）
  const costs = f.costumes;
  const noDress = rows.flat().filter(id => !costumeOf(id)).length;
  const items = costs.map((c, i) => ({ c, label: `${circled(i + 1)} ${c.name}（${rows.flat().filter(id => f.dress[id] === c.id).length}人）` }));
  if (noDress && costs.length) items.push({ c: null, label: `衣装なし（${noDress}人）` });
  const perLine = 4, legH = items.length ? Math.ceil(items.length / perLine) * 8 + 4 : 0;
  // ステージ
  const AUD = 9;   // 観客席の帯の高さ
  const X0 = 12, Y0 = 35, BW = 273, BH = 210 - Y0 - 10 - legH - AUD;
  rect(X0, Y0, BW, BH, '#fcfbff', '#111', 0.6, 2);
  text('ステージ', X0 + 3, Y0 + 6, 3.4, { c: '#666' });
  // 観客席（ステージの下）
  rect(X0 + BW * 0.15, Y0 + BH + 1.6, BW * 0.7, AUD - 3, '#f1f3f5', null, 0, 1.5);
  text('▼ 観客席 ▼', X0 + BW / 2, Y0 + BH + 1.6 + (AUD - 3) / 2 + 1.5, 4.2, { a: 'center', w: 700, c: '#495057' });
  const cx = X0 + BW / 2;
  ctx.save(); ctx.setLineDash([2.2 * mm, 1.6 * mm]); ctx.strokeStyle = '#333'; ctx.lineWidth = 0.4 * mm;
  ctx.beginPath(); ctx.moveTo(cx * mm, (Y0 + 9) * mm); ctx.lineTo(cx * mm, (Y0 + BH - 3) * mm); ctx.stroke(); ctx.restore();
  text('中心', cx, Y0 + 7, 3.2, { a: 'center', w: 700, c: '#333' });
  if (!total) text('（フィナーレに並ぶ子が、まだ選ばれていません）', cx, Y0 + BH / 2, 4, { a: 'center', c: '#c92a2a' });
  // 子どものカード：中心線から左右均等。どの列も同じ間隔なので、列どうしの位置がそろう
  const maxN = Math.max(1, ...rows.map(l => l.length));
  const slot = Math.min(32, (BW - 8) / maxN);
  const rowGap = (BH - 14) / Math.max(1, f.rows);
  const cardW = slot * 0.86, cardH = Math.min(rowGap * 0.66, 16);
  rows.forEach((l, ri) => {
    const yc = Y0 + BH - 3 - rowGap * (ri + 0.5);   // 1列目がいちばん下（観客席側）
    text(`${ri + 1}列目`, X0 - 1.2, yc + 1.1, 2.9, { w: 700, c: '#495057', a: 'right', max: 10.5 });   // 列の番号は枠の外（左）に
    l.forEach((id, j) => {
      const xc = cx + (j - (l.length - 1) / 2) * slot;
      const c = costumeOf(id), nm = shortName(id);
      rect(xc - cardW / 2, yc - cardH / 2, cardW, cardH, c ? tint(c.color, 0.32) : '#fff', c ? c.color : '#adb5bd', c ? 0.7 : 0.35, 1.6);
      if (c) {   // 衣装の番号（白黒で印刷しても分かるように）。カードの左上の角に、半分はみ出して付ける
        const r = Math.min(2.7, cardH * 0.18), bx = xc - cardW / 2 + r * 0.5, by = yc - cardH / 2 - r * 0.15;
        ctx.beginPath(); ctx.arc(bx * mm, by * mm, r * mm, 0, Math.PI * 2); ctx.fillStyle = c.color; ctx.fill();
        ctx.lineWidth = 0.4 * mm; ctx.strokeStyle = '#fff'; ctx.stroke();
        text(String(costumeNo(c)), bx, by + r * 0.42, r * 1.25, { a: 'center', w: 700, c: '#fff' });
      }
      const fsN = Math.min(cardH * 0.4, 6);
      if (nm.sur) text(nm.sur, xc, yc - cardH * 0.16, fsN * 0.55, { a: 'center', c: '#444', max: cardW - 2 });
      text(nm.given, xc, yc + (nm.sur ? cardH * 0.24 : fsN * 0.36), fsN, { a: 'center', w: 700, max: cardW - (c ? 3 : 1.5) });
    });
  });
  // 衣装の見本
  if (items.length) {
    const ly = Y0 + BH + AUD + 6, colW = BW / perLine;
    items.forEach((it, i) => {
      const lx = X0 + (i % perLine) * colW, y = ly + Math.floor(i / perLine) * 8;
      rect(lx, y - 4.2, 8, 5.4, it.c ? tint(it.c.color, 0.32) : '#fff', it.c ? it.c.color : '#adb5bd', 0.6, 1.2);
      text(it.label, lx + 10, y, 4, { w: 500, max: colW - 12 });
    });
  }
  text('1列目がいちばん前（観客席側）。カードの色と番号は衣装。中心線から左右均等に並んでいます。同じ名前の子は、上に小さく姓を書いています。', X0, 207, 2.7, { c: '#555', max: BW - 25 });
  ctx.restore();
}

function copyPrev() {
  const k = state.cur; if (k <= 1) { toast('場面1には前の場面がありません'); return; }
  const doIt = () => { const p = scene(k - 1); state.scenes[k] = Object.fromEntries(positions().map(x => [x.key, [...p[x.key]]])); state.gaps[k] = { ...gapOf(k - 1) }; save(); renderScene(); toast(`場面${k - 1}と同じ並びにしました。ここから入れ替えてください`); };
  if (placedCount(k)) confirmDlg(`場面${k}を、場面${k - 1}と同じ並びにしますか？`, `場面${k}で入れた内容は、場面${k - 1}の並びで置きかわります。`, '同じにする', doIt);
  else doIt();
}
function renderPreview() {
  const N = state.sceneCount, cv = $('pv');
  if (state.onFinale) {
    if (cv.width !== 1188) { cv.width = 1188; cv.height = 840; }   // フィナーレは横向き
    $('pvLabel').textContent = 'フィナーレ';
    $('pvPrev').disabled = false; $('pvNext').disabled = true;
    drawFinale(cv); return;
  }
  if (cv.width !== 840) { cv.width = 840; cv.height = 1188; }
  const k = Math.min(Math.max(1, state.cur), N);
  $('pvLabel').textContent = `場面${k} ／ 全${N}場面`;
  $('pvPrev').disabled = k <= 1; $('pvNext').disabled = false;
  drawPage(cv, k);
}

/* ============================================================
   PDF の作成（A4縦・場面ごとに1ページ）
   ============================================================ */
async function makePdf() {
  if (!state.roster.length) { toast('先に名簿を読み込んでください'); return; }
  const empty = []; for (let j = 1; j <= state.sceneCount; j++) if (!placedCount(j)) empty.push(j);
  if (empty.length) toast(`場面${empty.join('・')}は、まだ誰も入っていません`, 3500);
  await (document.fonts && document.fonts.ready);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
  const cv = document.createElement('canvas'); cv.width = 1654; cv.height = 2339;   // 約200dpi
  for (let k = 1; k <= state.sceneCount; k++) {
    if (k > 1) pdf.addPage('a4', 'portrait');
    drawPage(cv, k);
    pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    await new Promise(r => setTimeout(r, 0));
  }
  // 最後にフィナーレ（A4横）
  pdf.addPage('a4', 'landscape');
  const cvF = document.createElement('canvas'); cvF.width = 2339; cvF.height = 1654;
  drawFinale(cvF);
  pdf.addImage(cvF.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210, undefined, 'FAST');
  if (!finPlaced()) toast('フィナーレに並ぶ子がまだ選ばれていません', 3500);
  const name = `立ち位置_${state.className || 'クラス'}${state.title ? '_' + state.title : ''}.pdf`.replace(/[\\/:*?"<>|]/g, '');
  const blob = pdf.output('blob');
  const url = URL.createObjectURL(blob);
  const file = new File([blob], name, { type: 'application/pdf' });
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  openDlg(`<div class="dlg"><h3>PDFができました</h3>
    <p style="margin:0">${esc(name)}（${state.sceneCount + 1}ページ：場面${state.sceneCount}ページ＋フィナーレ）</p>
    <div class="list">
      ${canShare ? '<button type="button" id="pdShare">📤 保存・共有・印刷する<small>「ファイルに保存」や「プリント」を選べます</small></button>' : ''}
      <button type="button" id="pdOpen">📄 PDFを開く</button>
      <a href="${url}" download="${esc(name)}" style="text-decoration:none"><button type="button" style="width:100%;text-align:left">⬇ PDFをダウンロード</button></a>
    </div>
    <div class="acts"><button type="button" data-close>閉じる</button></div></div>`);
  $('pdShare')?.addEventListener('click', () => navigator.share({ files: [file], title: name }).catch(() => {}));
  $('pdOpen').onclick = () => window.open(url, '_blank');
}

/* ============================================================
   データ（この端末の中）：書き出し・読み込み・消す
   ============================================================ */
function dataMenu() {
  openDlg(`<div class="dlg"><h3>データ</h3>
    <p class="hint" style="margin:0">作業中の内容は、この端末の中に自動で保存されています。別のiPadで続きをするときは、ファイルに書き出して読み込みます。</p>
    <div class="list">
      <button type="button" id="dmExp">⬇ ファイルに書き出す（.json）<small>名簿・場面・並びがすべて入ります（園児の名前が入るので扱いに注意）</small></button>
      <button type="button" id="dmImp">📂 ファイルから読み込む</button>
      <button type="button" id="dmClear" style="color:var(--bad)">🗑 この端末からデータを消す<small>名簿と並びをすべて消して、最初からにします</small></button>
    </div>
    <div class="acts"><button type="button" data-close>閉じる</button></div></div>`);
  $('dmExp').onclick = () => {
    const name = `立ち位置データ_${state.className || 'クラス'}${state.title ? '_' + state.title : ''}.json`.replace(/[\\/:*?"<>|]/g, '');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000); closeDlg();
  };
  $('dmImp').onclick = () => { closeDlg(); $('jsonIn').click(); };
  $('dmClear').onclick = () => confirmDlg('この端末からデータを消しますか？', '名簿・場面・並びがすべて消えます。元に戻せません。', '消す', () => {
    try { Object.keys(localStorage).filter(k => k.startsWith(NS)).forEach(k => localStorage.removeItem(k)); } catch (e) { }
    state = blank(); lastBook = null; $('classBox').hidden = true; $('fileInfo').textContent = 'Numbers・Excel・CSV に対応'; renderAll(); toast('消しました');
  });
}
$('jsonIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.roster) || typeof s.scenes !== 'object') throw 0;
    state = { ...blank(), ...s, sceneCount: Math.min(MAX_SCENES, Math.max(1, +s.sceneCount || 1)) };
    save(); renderAll(); toast('読み込みました');
  } catch (err) { toast('このファイルは読み込めませんでした'); }
});

/* ---------- ダイアログ ---------- */
function openDlg(html) { const d = $('dlg'); d.innerHTML = html; d.querySelectorAll('[data-close]').forEach(b => b.onclick = closeDlg); if (!d.open) d.showModal(); }
function closeDlg() { const d = $('dlg'); if (d.open) d.close(); }
function confirmDlg(title, body, okLabel, fn) {
  openDlg(`<div class="dlg"><h3>${esc(title)}</h3><p style="margin:0">${esc(body)}</p><div class="acts"><button type="button" data-close>やめる</button><button type="button" class="primary" id="cfOk">${esc(okLabel)}</button></div></div>`);
  $('cfOk').onclick = () => { closeDlg(); fn(); };
}
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) closeDlg(); });

/* ---------- 操作 ---------- */
$('btnFile').onclick = () => $('fileIn').click();
$('fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadRosterFile(f); });
$('classSel').addEventListener('change', e => { if (e.target.value !== '') applyClass(+e.target.value); });
$('className').addEventListener('input', e => { state.className = e.target.value; save(); renderPreview(); });
$('title').addEventListener('input', e => { state.title = e.target.value; save(); renderPreview(); });
function setCount(n) {
  n = Math.min(MAX_SCENES, Math.max(1, n));
  if (n === state.sceneCount) return;
  state.sceneCount = n;
  if (state.cur > n) state.cur = n;
  save();
  $('scCount').textContent = n;          // 間の数字を変える
  renderSceneNames(); renderEditor(); renderPreview();
}
$('scMinus').onclick = () => {
  const n = state.sceneCount - 1; if (n < 1) return;
  const lastLine = 'w' + (state.sceneCount - 1);
  const used = placedCount(state.sceneCount) || Object.values(state.scenes).some(sc => (sc[lastLine] || []).length);
  if (used) confirmDlg(`場面${state.sceneCount}を減らしますか？`, `場面${state.sceneCount}と、「待機${state.sceneCount - 1}」の列に入れた子は使われなくなります（場面を増やし直すと戻ります）。`, '減らす', () => setCount(n));
  else setCount(n);
};
$('scPlus').onclick = () => { if (state.sceneCount >= MAX_SCENES) { toast(`場面は${MAX_SCENES}までです`); return; } setCount(state.sceneCount + 1); };
$('pvPrev').onclick = () => {
  if (state.onFinale) { state.onFinale = false; state.cur = state.sceneCount; }
  else if (state.cur > 1) state.cur--;
  else return;
  save(); state.roster.length ? renderScene() : renderPreview();
};
$('pvNext').onclick = () => {
  if (state.onFinale) return;
  if (state.cur < state.sceneCount) state.cur++; else state.onFinale = true;   // 最後の場面の次はフィナーレ
  save(); state.roster.length ? renderScene() : renderPreview();
};
$('btnPdf').onclick = makePdf;
$('btnMore').onclick = dataMenu;

/* ---------- 起動 ---------- */
renderAll();
if (document.fonts) document.fonts.ready.then(renderPreview);
// オフライン対応：このフォルダの sw.js に登録（どうぐばことは別）。保存したデータが自動で消されにくくする
if (/^https?:$/.test(location.protocol)) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
</script>
</body>
</html>
